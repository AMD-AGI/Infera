apiVersion: v1
kind: Pod
metadata: {name: NODEPOD, namespace: default}
spec:
  nodeName: NODENAME
  hostNetwork: true
  restartPolicy: Never
  containers:
  - name: import
    image: docker.io/library/busybox:1.36
    imagePullPolicy: IfNotPresent
    securityContext: {privileged: true}
    command: ["/bin/sh","-c"]
    args: ["ARGS"]
    volumeMounts:
    - {name: ctrbin,     mountPath: /host/ctr,             readOnly: true}
    - {name: dockerbin,  mountPath: /host/docker,          readOnly: true}
    - {name: dockersock, mountPath: /var/run/docker.sock}
    - {name: ctrsock,    mountPath: /run/k3s/containerd/containerd.sock}
  volumes:
  - {name: ctrbin,     hostPath: {path: /usr/bin/ctr,      type: File}}
  - {name: dockerbin,  hostPath: {path: DOCKERBIN,         type: File}}
  - {name: dockersock, hostPath: {path: /var/run/docker.sock, type: Socket}}
  - {name: ctrsock,    hostPath: {path: /run/k3s/containerd/containerd.sock, type: Socket}}
