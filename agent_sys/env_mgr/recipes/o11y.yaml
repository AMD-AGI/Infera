#
# agent_sys/o11y's Python runtime: one venv in agent_sys's prefix, `share/o11y/venv`, used by every
# process the o11y plugins start (the ledger door's MCP server and backstop, the analysis jobs) through
# their launchers (door `bin/py`, analysis `server/o11y-run`). Modelled on `agentsview.o11y.yaml`.
#
# Why a venv of its own: the door's MCP server and the analysis jobs run inside every fleet session and
# must not depend on whichever Python environment the user's project activates. uv (already required by
# agent_sys: `uv run env-mgr …`) creates it and installs the three pinned ranges in one line, so the item is
# a `oneline`; `--allow-existing` and uv's own idempotence make a re-run a no-op.
#
# `importance: suggested` makes a failed install a warning, not a failure: o11y may never fail a
# deployment.
#
# `target.path` is a placeholder, as in the other recipes; pass the prefix:
#
#   env-mgr install env_mgr/recipes/o11y.yaml --path "$AGENT_SYS_HOME"
#
# Both strings run with the prefix as their working directory, so they use prefix-relative paths and need
# no `$AGENT_SYS_HOME` in the environment. Registering the plugins with Claude Code is not here: it changes
# the user's Claude configuration, and `agent_sys/o11y/README.md` lists it as the user's step.
version: 1

target:
  kind: prefix
  name: infera_agent_sys
  path: /path/to/your/.infera_agent_sys

items:
  - installer: oneline
    importance: suggested
    name: o11y-venv
    tags: [o11y]
    check_cmd: "./share/o11y/venv/bin/python -c 'import mcp, jsonschema, pydantic, referencing'"
    run: "uv venv --quiet --allow-existing share/o11y/venv && uv pip install --quiet --python share/o11y/venv/bin/python 'mcp>=2,<3' 'jsonschema>=4.18' 'pydantic>=2'"
