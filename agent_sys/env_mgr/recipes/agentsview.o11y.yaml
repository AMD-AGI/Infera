#
# AgentsView, agent_sys's o11y panel. An external dependency, installed
# unmodified into agent_sys's own prefix.
#
# `importance: suggested` is load-bearing, not decoration: `level_for_missing`
# turns a failed install of a non-required item into a warning, which is
# exactly the "o11y may never fail a deployment" rule, using the mechanism
# env_mgr already has rather than a second one.
#
# `target.path` below is a placeholder, same convention as
# `recipes/sglang.repo.yaml`: neither `recipe.py` nor the `bin` installer
# expand `${VAR}` in a YAML value (confirmed by reading `recipe.py::load_recipe`
# and `installers/base.py::run_cmd` — there is no templating layer anywhere in
# env_mgr). The one substitution point that *is* real code is the CLI's
# `--path` flag (`cli.py:75`, `target.path = args.path`); `env_mgr/o11y/
# agentsview.py::ensure_installed` supplies it the same way in code
# (`target.path = str(prefix.root)`) for the programmatic caller, or a human
# can do the same thing via `--path` for a manual invocation:
#
#   env-mgr install env_mgr/recipes/agentsview.o11y.yaml --path "$AGENT_SYS_HOME"
#
# `install:` and `check_cmd:` both run via `subprocess.run(cmd, shell=True,
# cwd=target.path)` with no explicit `env=` (`installers/base.py::run_cmd`), so
# both inherit whatever environment the process itself was started with —
# neither sees `target.path` or any other recipe field. `check_cmd:` is
# therefore an **absolute** path rather than a bare command name: a bare
# `agentsview --version` only finds the binary (and thus only ever reports
# "already present (skip)" on a second run) if `$AGENT_SYS_HOME/bin` happens to
# already be on the caller's `PATH` — measured directly by running this recipe
# with and without that on `PATH` — and nothing upstream of this recipe
# guarantees that: `agent_environment()` in `prefix.py` deliberately does
# *not* put `$AGENT_SYS_BIN` on `PATH` for spawned agent children
# (`bin_on_path=False` from `prepare.py`, since `PATH` there is a projection of
# the isolation policy's granted set, not a free-form string). `$AGENT_SYS_HOME`
# is the one variable both `install:` and `check_cmd:` need, and
# `ensure_installed` patches it into `os.environ` for exactly the duration of
# the call (see `agentsview.py::_patched_environ`) — a human running `env-mgr`
# directly must export it themselves, as in the line above.
#
# The checksum gate is **two statements, not one `&&` list**, and that is not
# style. `set -e` does not fire for a command that is not the last in an `&&`
# list, so `[ -n "$expected" ] && [ "$expected" = "$actual" ]` short-circuited
# and *carried on* whenever `awk` matched no line — installing an unverified
# binary in exactly the case the `-n` test was written to catch (a renamed
# release asset, a changed `SHA256SUMS` format). A genuine mismatch aborted
# correctly the whole time, which is why it read as working.
# `tests/env_mgr/test_o11y_agentsview.py` runs this string for real against a
# stubbed `curl` in all three cases: match, mismatch, and checksum-not-found.
#
# `${tmp:?}` in the trap for the same class of reason: a recursive delete whose
# target is a variable is one unset variable away from a much larger delete,
# and `:?` makes the empty expansion abort instead of expand.
#
# The download is pinned to a specific release rather than "latest": a
# floating install means two machines can end up running different panels
# with no record of which, and re-deriving "latest" here would duplicate
# logic the upstream install.sh already owns (`get_latest_version`). Bumping
# the version is a one-line edit of the three places it appears below plus
# `version:`.
version: 1

target:
  kind: prefix
  name: infera_agent_sys
  path: /path/to/your/.infera_agent_sys

items:
  - installer: bin
    importance: suggested
    layer: system
    name: agentsview
    version: "0.42.0"
    check_cmd: "$AGENT_SYS_HOME/bin/agentsview --version"
    install: >-
      set -e;
      tmp=$(mktemp -d);
      trap 'rm -rf "${tmp:?}"' EXIT;
      base="https://github.com/kenn-io/agentsview/releases/download/v0.42.0";
      curl -fsSL "$base/agentsview_0.42.0_linux_amd64.tar.gz" -o "$tmp/av.tgz";
      curl -fsSL "$base/SHA256SUMS" -o "$tmp/SHA256SUMS";
      expected=$(awk '$2=="agentsview_0.42.0_linux_amd64.tar.gz"{print $1}' "$tmp/SHA256SUMS");
      [ -n "$expected" ] || exit 1;
      actual=$(sha256sum "$tmp/av.tgz" | cut -d' ' -f1);
      [ "$expected" = "$actual" ];
      tar -xzf "$tmp/av.tgz" -C "$tmp" agentsview;
      mkdir -p "$AGENT_SYS_HOME/bin";
      mv "$tmp/agentsview" "$AGENT_SYS_HOME/bin/agentsview";
      chmod +x "$AGENT_SYS_HOME/bin/agentsview"
    tags: [o11y]
