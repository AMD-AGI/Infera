#
# The DEFAULT recipe layer — the one nobody names, because it always applies.
#
# It sits in `env_mgr/` and not in `env_mgr/recipes/`: `recipes/` is the
# namespace of things you *name* in `recipes: [agent_sys:x]`. No field marks
# this one as the default; the path does. See `env_mgr/recipes/README.md`.
#
# It runs first, before the package layer and before the agent's own. The layers
# CONCATENATE — a later layer adds items, it does not override this one — which
# costs nothing because every installer gates on `check` before `install`.
#
# Nothing declares this file, so its absence is simply absence, not the
# declared-and-absent error that only the agent layer can reach.
version: 1

target:
  kind: workspace
  name: default
  # A deliberate placeholder, overridden at run time by `--path`. A real path in
  # a data file is one machine's answer, and `agent_assets._run_recipe` always
  # passes `--path` precisely so this never has to be right. It must be
  # overridden rather than merely ignored: `subprocess.run` RAISES when `cwd`
  # does not exist, so a stale value here is a crash and not a bad outcome.
  path: /path/to/the/zone/workspace

items:
  # uv is hoisted here because more than one recipe would otherwise repeat it.
  # `strongly-suggested`, not `required`: a required item in the default layer
  # fails every agent on a host without uv, including agents that never wanted
  # it. Where uv already resolves on the zone PATH this reports `present` and
  # the install branch does not run.
  - installer: bin
    importance: strongly-suggested
    name: uv
    check_cmd: "uv --version"
    install: "pip install uv"
    tags: [toolchain]
