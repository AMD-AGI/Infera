#
# The DEFAULT recipe layer — the one nobody names, because it always applies.
#
# It sits here, in `env_mgr/`, and NOT in `env_mgr/recipes/`. That placement is
# the whole of how a reader tells the two apart: `recipes/` is the namespace of
# things you *name* in `recipes: [x]`, and this is not in it. No field says
# "this one is the default"; the path does. See `env_mgr/recipes/README.md`.
#
# Run first, before the package layer and before the agent's own — most general
# to most specific (`agent_assets.py::_recipe_paths`). The layers CONCATENATE:
# a later layer adds items, it does not override this one. That costs nothing,
# because every installer gates on `check` before `install`, so an item two
# layers both declare is done once and reported twice.
#
# **Nothing declares this file, so its absence is simply absence** — not the
# declared-and-absent error, which only the agent layer can reach.
#
# ---------------------------------------------------------------------------
# WHAT BELONGS IN HERE IS NOT SETTLED, AND THIS FILE DOES NOT PRETEND OTHERWISE.
#
# The deliverable of this round is the *layer* — that a default exists, where it
# lives, when it runs, and how it composes. Its CONTENTS are a separate question
# the owner has not ruled on. One item is here rather than none, so that the
# layer has a witness that actually runs; a layer whose only evidence is a test
# is a layer nobody has seen work.
#
# Do not read this single item as "the default set". Candidates raised and NOT
# added, each for a stated reason:
#
#   - the operator's 12 marketplace plugins: needs `claude plugin marketplace
#     add anthropics/claude-plugins-official` first, and that clone was measured
#     going over SSH (`git@github.com:`). A zone with no agent-forwarded key
#     fails it, and whether `claude` falls back to HTTPS was never measured.
#   - `gh`: already present on this host, so its install branch would never be
#     exercised here and could not be claimed as tested.
#
# ---------------------------------------------------------------------------
version: 1

target:
  kind: workspace
  name: default
  # A deliberate placeholder, overridden at run time by `--path`. A real path in
  # a data file is one machine's answer, and `agent_assets._run_recipe` always
  # passes `--path` precisely so this never has to be right. It must be
  # overridden rather than merely ignored: `subprocess.run` RAISES when `cwd`
  # does not exist, so a stale value here is a crash and not a bad outcome.
  path: /path/to/the/zone/workspace

items:
  # --- uv, because three other things in this tree assume it ---------------- #
  #
  # `recipes/serena.yaml` and `recipes/sglang.repo.yaml` each carry this same
  # item, and an agent that wants either pays for it twice today. Hoisting it to
  # the default layer is exactly what a default layer is for: the thing more
  # than one recipe would otherwise repeat.
  #
  # **`strongly-suggested`, not `required`.** In serena's recipe uv is the only
  # thing the file does, so a missing uv is that whole recipe failing and saying
  # so early is cheaper. Here it is a convenience for whatever comes later, and
  # a `required` item in the DEFAULT layer would fail every agent on every run
  # on a host without uv — including agents that never wanted it. The default
  # layer is the one place where `required` is a decision about other people's
  # runs.
  #
  # Measured on this host 2026-09-04: `uv 0.11.24` resolves on the *zone* PATH
  # (`/home/yihou/miniconda3/bin/uv`), not merely on the operator's. So here
  # this reports `present` and installs nothing — **which means the install
  # branch below is NOT exercised on this host and must not be claimed as
  # tested.**
  - installer: bin
    importance: strongly-suggested
    name: uv
    check_cmd: "uv --version"
    install: "pip install uv"
    tags: [toolchain]
