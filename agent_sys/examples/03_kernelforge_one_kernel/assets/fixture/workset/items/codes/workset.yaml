    substitution: call_site_fragment
    call_site:
      fragment: logits[:] = torch.softmax(logits, dim=-1)
      call: sampler_softmax(logits, logits)
    public_symbol: null
    signature: 'sampler_softmax(logits: Tensor[B, V] fp32, out: Tensor[B, V] fp32)
      -> Tensor'
    invariants:
    - writes in place into the caller-provided `out`; the call site is `logits[:]
      = ...`, so a replacement that allocates is not substitutable there
    - fp32 in and fp32 out
    - every output row sums to 1 within 1e-4; these feed torch.multinomial, and a
      row that does not is a sampler drawing from the wrong distribution
    - the reduced dimension is the last one and is contiguous; a replacement that
      relies on that must say so, because a non-contiguous `logits` then gives wrong
      results rather than an error
    - no build step may be added; a replacement needing compilation cannot be delivered
      as an overlay
    apply_mode: patch_in_place
    requires_restart: true
    build_step: null
