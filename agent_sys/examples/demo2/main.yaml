# The outermost graph. Its name is fixed and its presence is what makes this
# directory a task package (main spec §4.3).
#
# Where `examples/demo/` is a chain of three, this is the shape that chain
# cannot show: a **fan-out** to three independent solvers, a **fan-in** that
# joins them, and a **depth-2 nesting** — `grade` is itself a subgraph of six.
# Everything below is chosen to exercise one of those three and nothing else.
#
# `main` is a **non-leaf**: it carries `assets/main.task/readme.md` and no
# `entry.sh`, because its work *is* its subgraph and the two are mutually
# exclusive (`closure` spec §2.6). It declares **no `agent`** — `closure.schema.json`
# requires one of a leaf and of nothing else — and **no `resources`**, because
# only a leaf may acquire and a parent holding a lease while its subtasks queue
# for the same pool is the deadlock `task_graph` criterion 53 forbids.
#
# There is **no `body:` key** here or anywhere else in this package. A folder
# named `${name}.${type}` under `assets/` scopes the lookup and `readme.md` /
# `entry.sh` are then found by their own names. Binding one by hand is legal and
# warns at compile time, so a layout that needs bindings is a layout that failed.
module: task
name: main
description: Set algorithm homework, solve it three ways, grade the answers, and optimise them.

# **Every kind the subtree uses, declared here.** A task's `inputs`/`outputs`
# must each appear in its closure's `handoffs` (`closure` spec §4 check 2), and
# permissions are inherited downwards, so the root is the one place that has to
# know the full vocabulary. The kinds themselves are *defined* in the step file
# of their producer — `steps/directions.yaml` owns `directions`, and so on; this
# list only references them.
#
# Five of these — `review_x`, `review_y`, `review`, `harness`, `extra_tests` —
# are produced and consumed entirely inside `grade`. They are named here because
# the root's grants must cover them, not because anything out here reads them:
# `task_graph/graph.py`'s containment check is fatal about that, and only
# `scores` leaves `grade`.
handoffs:
  - directions
  - problems
  - solutions_a
  - solutions_b
  - solutions_c
  - review_x
  - review_y
  - review
  - harness
  - extra_tests
  - scores
  - optimised

# A non-leaf runs nothing, so there is nothing of its own to validate. The ten
# validators in this package all hang off the handoff kinds, in the step files
# that declare them.
validators: []

task:
  goal: Set homework, solve it three ways, grade the answers, and optimise them.
  version: '1'

  # `main` consumes nothing from outside the package. **A kind nobody inside a
  # subgraph produces resolves to the parent's own input** (`models.py:349-361`),
  # so an empty list here is also what makes `grade`'s `review_x` and `review_y`
  # correctly edge-free — they read `problems` and the three `solutions_*`, all
  # of which are `grade`'s inputs rather than anything `grade` produces.
  inputs: []

  # **`optimised`, and only `optimised`.** The end entry's outputs are the sole
  # route by which a handoff produced inside a subgraph leaves it
  # (`task_graph` criterion 50), and `optimise` is marked `is_end` below.
  outputs: [optimised]

  # Inherited by every subtask: `Task._instantiate` passes the parent's
  # permissions down, so the root's set has to cover the whole subgraph —
  # including the two levels of it, since `grade`'s six members inherit through
  # `grade`, which inherits from here.
  #
  # **WRITE covers READ**, so one grant per kind covers both the producer and
  # every consumer. Twelve kinds, twelve grants; the alternative is twenty-eight
  # narrower ones that say the same thing and go stale the first time an edge
  # moves.
  permissions:
    grants:
      - {path: handoffs/directions, access: write, kind: directions}
      - {path: handoffs/problems, access: write, kind: problems}
      - {path: handoffs/solutions_a, access: write, kind: solutions_a}
      - {path: handoffs/solutions_b, access: write, kind: solutions_b}
      - {path: handoffs/solutions_c, access: write, kind: solutions_c}
      - {path: handoffs/review_x, access: write, kind: review_x}
      - {path: handoffs/review_y, access: write, kind: review_y}
      - {path: handoffs/review, access: write, kind: review}
      - {path: handoffs/harness, access: write, kind: harness}
      - {path: handoffs/extra_tests, access: write, kind: extra_tests}
      - {path: handoffs/scores, access: write, kind: scores}
      - {path: handoffs/optimised, access: write, kind: optimised}

  # **`froms` is mandatory on every entry, and `[]` is an answer.** The edge is
  # derived from the handoff wiring — `models.derived_edges` walks each entry's
  # input kinds and takes the producer recorded earlier in this list — and what
  # is written here is *checked against* that derivation. A derived edge missing
  # from `froms` is an error naming both sides; an extra one is reported and not
  # fatal, because "a dependency that shares no handoff" is a supported thing to
  # write and is indistinguishable from the mistake.
  #
  # So the lists below are not a summary. They are exactly the derived set, and
  # shortening one is a load failure.
  #
  # **The fan-out is three lines and costs nothing.** `solve_a`, `solve_b` and
  # `solve_c` all consume `problems`, all get an edge to the one producer of it,
  # and all become eligible in the same scheduler pass — `runner.start` spawns a
  # thread per dispatch, so they genuinely run at once.
  #
  # **The fan-in is why they have three different output kinds.**
  # `producer_of[kind]` and `available[kind]` are single-slot
  # (`models.py:360,747,757`), so three producers of one `solutions` kind would
  # leave only the last one visible to `grade` and the other two would vanish
  # silently. `solutions_a` / `_b` / `_c` is not a naming style; it is the only
  # way to write a three-way join in this engine today.
  #
  # **No `is_start`.** Index 0 is always a root of the derived graph — the
  # listing order must be a valid topological order — so the mark could carry no
  # information here.
  #
  # **`is_end` stays**, because its default is *positional*: absent, the last
  # entry is the end, so appending an eighth entry would silently move the
  # subgraph's exit and with it the one kind that escapes.
  subgraph:
    - {closure: directions, froms: []}
    - {closure: problems, froms: [directions]}
    - {closure: solve_a, froms: [problems]}
    - {closure: solve_b, froms: [problems]}
    - {closure: solve_c, froms: [problems]}
    # The join. Four inputs, four edges, and `grade` is a non-leaf itself — the
    # depth-2 case, root → grade → six leaves.
    - {closure: grade, froms: [problems, solve_a, solve_b, solve_c]}
    # `scores` comes out of `grade`; `problems` and the three solution kinds
    # come from further back, and each still derives its own edge.
    - {closure: optimise, froms: [problems, solve_a, solve_b, solve_c, grade], is_end: true}
