# The first entry of `main`, and the only one with no inputs at all.
#
# One file per step, holding everything that step introduces, in the order the
# format imposes: a name referenced before it is defined *in this file* is an
# error, so the parts come first and the step that assembles them comes last.
# Nothing is defined inline — an inline definition is hoisted above its host
# under its own name, which is a top-level definition written somewhere less
# greppable.
#
# There is no `shared.yaml` in this package. Nothing here is used by two steps:
# both leaves are AI, so no program agent is needed, and each of the three
# validator bodies is a script that `validator.ScriptBodyRunner` runs directly.

# --------------------------------------------------------------------------- #

# The AI half. A teacher setting the syllabus.
#
# `backend_entry` is the dotted form rather than an entry-point name: a task
# package outside this repository cannot register an entry point in the
# `agent_sys.backends` group without being installed, and this package is data.
- module: agent
  name: teacher
  kind: ai
  version: '1'
  description: Chooses the classic algorithm areas a course will cover.

  # The scale knob, and the only route a package variable has into a body. The
  # readme says `$TWO_TASK_N_DIRECTIONS` and never a literal count. The same
  # `${n_directions:-2}` appears in `check_directions.args` below so that the
  # prompt and the check move together; that duplication is not avoidable.
  env:
    TWO_TASK_N_DIRECTIONS: '${n_directions:-2}'
  backends:
    - key: claude_code_sdk
      backend_entry: agent.backends.claude_sdk:ClaudeSdkBackend
      err: the claude backend needs `pip install -e "agent_sys[claude]"`

# --------------------------------------------------------------------------- #

# Completeness: the direction list is the right length, drawn from the closed
# catalogue, free of duplicates, and every entry says why.
#
# `strong`, and the readme earns it. Three of the four rules are exact — a
# count, a set membership over a verbatim pair, a uniqueness test — and the
# fourth reduces "prose" to a character floor and a word count. Crude, stated,
# and total over the document: that is what `strong` claims.
- module: validator
  name: check_directions
  version: '1'
  brief: The directions are the requested count, from the CLRS catalogue, unique, and reasoned
  dimension: completeness
  strength: strong
  inputs: [directions]
  # No `body:`. `assets/check_directions.validator/readme.md` and `entry.sh` are
  # found by the folder's name — `${name}.${type}`.
  args:
    # The count reaches the check through `args`, not the agent's `env`, and
    # that is measured. A validator body's environment comes from
    # `validator.choose_configuration` (`validator/environment.py:116-142`):
    # an INPUT phase falls through to the global row, which does not carry
    # `TWO_TASK_N_DIRECTIONS`, and `problems` re-runs this validator there.
    expected_count: '${n_directions:-2}'
    # The closed list, named rather than hardcoded in the body: two validators
    # differing only in a parameter are two registry entries over one
    # implementation (`validator` criterion 12). Relative to the package root.
    catalog: assets/catalog/clrs_topics.json
  tags:
    logic_source: external_static
    cost: seconds
    domain: [demo]

# --------------------------------------------------------------------------- #

# What `directions` writes: the areas the course will cover.
#
# `structured_text` because that is what it is — a JSON document with a declared
# shape and nothing that ran. The type requires one of
# `text.json` / `text.yaml` / `text.xml` and a README carrying `Purpose` and
# `Schema` (`handoff/content.py:75-80`).
- module: handoff
  name: directions
  version: '1'
  description: The classic algorithm areas a course will cover, one row each.
  content_type: structured_text
  scope: fixed.required
  items_schema:
    type: object
    additionalProperties: false
    required: ['text.json']
    properties:
      # A file item reaches the check as its own file name, so the schema types
      # the presence of the file and not its contents. What is *in* it is
      # `check_directions`' job.
      'text.json': {type: string}
  # A kind is never valid without at least one validator (`handoff` spec §5.3).
  validators: [check_directions]

# --------------------------------------------------------------------------- #

# The step.
#
# It has no inputs, so its input validation phase is empty and runs nothing.
# Being the graph's first entry, that is a property of its position.
- module: task
  name: directions
  description: Choose the algorithm areas the course will cover.
  agent: teacher
  handoffs: [directions]
  # Declared because the specs call this the phase-validator list.
  # `validator.PhaseRunner` selects from the handoff kind's own list instead,
  # and the two agree here on purpose.
  validators: [check_directions]
  task:
    # ≤ 100 characters, and a human label rather than an instruction channel —
    # `task.schema.json` caps it and `closure` spec §2.6 is explicit that goal
    # and body are not two names for one thing.
    goal: Choose the classic algorithm areas this course will cover.
    version: '1'
    inputs: []
    outputs: [directions]
    permissions:
      grants:
        - {path: handoffs/directions, access: write, kind: directions}
