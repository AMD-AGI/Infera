# The outermost graph. Its name is fixed and its presence is what makes this
# directory a task package (main spec §4.3).
#
# This package's subject is **`agent_sys` itself**. Where `examples/demo` shows
# the graph machinery and `examples/single_real_task` runs a real workload, this
# one runs a single leaf whose entire job is to answer one question about the
# system that started it: *did the seven Claude Code capabilities this agent
# declares actually arrive, across all three install levels?*
#
# That subject decides the shape. There is nothing to parallelise, nothing to
# sequence, and no second step that could fail for an unrelated reason — one
# leaf, one handoff kind, two validators. A second step would be a second way
# for a run to fail that has nothing to do with the question.
#
# `main` is a **non-leaf**: it carries `assets/main.task/readme.md` and no
# `entry.sh`, because its work *is* its subgraph and the two are mutually
# exclusive (`closure` spec §2.6). It declares **no `agent`** —
# `closure.schema.json` requires one of a leaf and of nothing else — and **no
# `resources`**, because only a leaf may acquire and nothing here needs a GPU.
#
# There is **no `body:` key** here or anywhere else in this package. A folder
# named `${name}.${type}` under `assets/` scopes the lookup and `readme.md` /
# `entry.sh` are then found by their own names.
module: task
name: main
description: Prove that seven Claude Code capabilities install per-agent across three levels.

# One kind, declared here because the root's grants must cover the whole
# subtree: permissions are inherited downwards, so the root is the one place
# that has to know the full vocabulary. `env_report` is *defined* in
# `steps/check.yaml`, beside its producer; this list only references it.
handoffs:
  - env_report

# A non-leaf runs nothing, so there is nothing of its own to validate. Both
# validators in this package hang off the `env_report` kind, in the step file
# that declares it.
validators: []

task:
  goal: Prove seven Claude Code capabilities install per-agent across three levels.
  version: '1'

  # `main` consumes nothing from outside the package.
  inputs: []

  # `env_report`, and only `env_report`. The end entry's outputs are the sole
  # route by which a handoff produced inside a subgraph leaves it (`task_graph`
  # criterion 50), and `probe_env` is marked `is_end` below.
  outputs: [env_report]

  # One kind, one grant. **WRITE covers READ**, so this one line covers the
  # producer and any future consumer.
  permissions:
    grants:
      - {path: handoffs/env_report, access: write, kind: env_report}

  # **`froms: []` is an answer, not an omission.** The edge set is *derived*
  # from the handoff wiring (`task_graph/models.py:349-361`) and what is written
  # here is checked against that derivation; a derived edge missing from `froms`
  # is a load failure naming both sides. With one entry there is nothing earlier
  # to point at, so the derived set is empty and so is this.
  #
  # **`is_start` is absent and `is_end` is not**, and the asymmetry is the
  # schema's: absent, the *first* entry is the start — which a one-entry
  # subgraph satisfies for free — while absent, the *last* entry is the end, so
  # the mark carries no information today and starts carrying it the moment a
  # second entry is appended. Writing it now is what keeps the one kind that
  # escapes from moving silently later.
  subgraph:
    - {closure: probe_env, froms: [], is_end: true}
