#
# The PACKAGE recipe layer for `examples/env_checker` — auto-detected, never
# declared. `env_mgr/agent_assets.py::_package_recipe_path` looks for exactly
# `<staged package>/assets/main.env_recipe.yaml` and nothing else; no other
# spelling works here, unlike the agent layer. It runs after the default layer
# and before the agent's own `recipes:`.
#
# **Why this file exists at all**: the owner ruled that only an agent's own
# `assets/.claude/` tree may be installed by copying, and everything else is
# installed by declaring it in a recipe. `envchk-baseline`'s MCP server is a
# payload this repository ships, so a recipe puts it where the agent's
# `.mcp.json` says it will be.
version: 1

target:
  kind: workspace
  name: env_checker
  # Overridden at run time by `--path`; a real path in a data file is one
  # machine's answer. It must be overridden rather than merely ignored:
  # `subprocess.run` RAISES when `cwd` does not exist.
  path: /path/to/the/zone/workspace

items:
  # --- place the envchk-baseline MCP server inside the zone ----------------- #
  #
  # **The source is found by importing `env_mgr`, not by an environment
  # variable, and that is the point of addons living inside the package.**
  # `agent_assets._child_env` pins `PYTHONPATH` to the package root and
  # `installers/base.py::run_cmd` inherits it, so `import env_mgr` resolves in
  # this shell. Because `addons/` is now package data *inside* `env_mgr` (see
  # `pyproject.toml`), the same line works from a wheel install, where a path
  # built from the repository layout would not.
  #
  # This replaces an exported `AGENT_SYS_ADDONS_ROOT`, which is now gone: it was
  # the only exported path pointing outside the zone, and nothing needs it any
  # more. The server is COPIED IN, so the task body reads it from the zone and
  # never reaches back to the repository.
  #
  # **Runs unconfined and that is not an oversight.** Installs happen at
  # `prepare` step 6b, and `prepare` confines nothing (`env_mgr/prepare.py`:
  # *"Nothing here confines anything"*) — `Prepared.spawn` applies confinement to
  # the body afterwards. So this `cp` needs no grant on the source.
  #
  # `required`: the agent's `.mcp.json` names this exact path, and a missing
  # server is reported by Claude Code as a server with **no tools** rather than
  # as an error — the silent failure `addons/README.md` warns about. A named
  # failure here is the whole difference.
  - installer: embed
    importance: required
    name: envchk-baseline-server
    tags: [internal, envchk]
    run: |
      set -eu
      src="$(python3 -c 'import env_mgr, os; print(os.path.join(os.path.dirname(env_mgr.__file__), "addons", "envchk-baseline", ".claude", "servers"))')"
      test -f "$src/envchk_baseline_server.py"
      mkdir -p "$CLAUDE_CONFIG_DIR/servers"
      cp "$src/envchk_baseline_server.py" "$CLAUDE_CONFIG_DIR/servers/envchk_baseline_server.py"
