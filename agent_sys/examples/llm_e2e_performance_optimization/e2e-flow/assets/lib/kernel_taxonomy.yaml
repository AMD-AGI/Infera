# Kernel classification rules, read by `rank.py` and by `identify.py`.
#
# The device symbol name is the only evidence a 6-column Magpie CSV carries, so
# every rule here matches on it. Rules are tried in order and the first match
# wins, which is why `collective` and `vendor_tuned` come before the broader
# `routable` patterns: `hgemm_bf16_*` would otherwise be caught by the generic
# gemm rule.
#
# DESIGN.md section 6.1 explains why classification cannot be skipped: NCCL is
# 78.63% of the sample profile and forge-loop has no path for it.

version: 1

buckets:

  # Communication. Excluded: a single-GPU forge-loop driver cannot measure a
  # collective, and Hyperloom routes these to collective_driver_generator.py.
  - name: collective
    routable: false
    excluded_reason: not_routable_by_forge_loop
    patterns:
      - '^ncclDevKernel'
      - '^ncclKernel'
      - '^rccl'
      - 'ncclDevKernelArgsStorage'
      # MSCCL is the algorithm-programmable NCCL path; still a collective.
      # Found in the sample profile as `mscclKernel_Sum_hip_bfloat16_LL_false`.
      - '^msccl'
      - 'ncclDevComm'
      - 'AllReduce'
      - 'all_reduce'
      # **A framework's own in-process collective, which none of the patterns
      # above catch.** Measured on the real 124-kernel gfx950 table, not
      # reasoned about: `_ZN5aiter26cross_device_reduce_1stageIDF16bLi2ELb0EEE…`
      # is **52.12% of profiled GPU time**, the largest single item by a factor
      # of six — and it fell through to `unknown`, was marked routable, and
      # `rank` selected it as candidate #1. forge-loop's single-GPU driver
      # contract cannot measure a collective, so the whole campaign would have
      # been unmeasurable.
      #
      # The general shape of the miss is worth naming: the two patterns above
      # are written for a name a human wrote. A mangled C++ symbol carries
      # `cross_device_reduce` and neither `AllReduce` nor `all_reduce`, so a
      # vendor that names its collective anything else falls through again.
      # This rule closes the case in front of us; `todo.md` T4 is where the
      # class of problem belongs, and it is not closed by one pattern.
      - 'cross_device_reduce'

  # Assembly generated by Tensile / rocBLAS / hipBLASLt tuning pipelines.
  # Excluded: the optimization is a tuning-table change, not a source edit, so
  # forge-loop's edit-build-measure loop does not apply.
  - name: vendor_tuned
    routable: false
    excluded_reason: tuned_by_table_not_source
    patterns:
      - '^Cijk_'
      - '^hgemm_bf16_'
      - '^Sgemm_'
      - '^Cgemm_'
      # rocPRIM / hipCUB primitives: sort, scan, reduce trampolines. Owned by
      # the ROCm libraries, tuned there, not editable from a serving repo.
      - 'rocprim::'
      - 'hipcub::'
      - 'ROCPRIM_'

  # PyTorch ATen. Excluded: shared by every model on the machine, so a change
  # here reaches far outside this task's blast radius.
  - name: framework_native
    routable: false
    excluded_reason: shared_aten_kernel
    patterns:
      - '^void at::native::'
      - '^at::native::'
      - '^void at::'

  # Everything with an identifiable owner that forge-loop can edit.
  - name: routable
    routable: true
    patterns:
      - '^_ZN5aiter'          # aiter C++ mangled
      - '^aiter'
      - '^void aiter::'
      - '^mfma_'              # aiter / CK assembly MoE and GEMM
      - '^_ZN2ck'             # composable_kernel mangled
      - 'GridwiseMoeGemm'
      - 'ck_tile'
      - '_kernel_BLOCK_SIZE'  # triton, params encoded in the name
      - '^triton_'
      - '^_gemm_'
      # Triton JIT kernels compiled from sglang/aiter python keep their python
      # function name, which by convention starts with `_` and contains `_fused`
      # or ends `_kernel`. Seen in the sample profile as
      # `_fused_qk_rope_cat_and_cache_mla_kernel`.
      - '^_fused_'
      - '^_gluon_'
      - '^_[a-z0-9_]+_kernel$'
      - '^main_kernel$'       # tilelang generated, opaque by design
      - 'topk_transform'
      - '^sgl'
      - 'sglang'
      - '^_ZN7sgl_hip'        # sgl-kernel's own HIP kernels
      - 'sgl_hip'
      - 'triton_kernel'
      - 'act_quant'
      - 'act_and_mul'
      - 'hadamard_transform'
      - '^topk_kernel'
      - 'topk_kernel'
      - '_fwd_kernel'
      - '_bwd_kernel'
      - 'flash_'
      - 'paged_attention'
      - 'rmsnorm'
      - 'silu_mul'

# Which forge-loop --fellow to request, by symbol shape. First match wins.
# `identify.py` uses this as a first guess; the AI task may correct it after
# reading the source.
fellows:
  - fellow: triton-fellow
    language: triton
    patterns:
      - '_kernel_BLOCK_SIZE'
      - '^triton_'
      - '^_gemm_a16_w16'
      - '^_fused_'
      - '^_gluon_'
      - '^_[a-z0-9_]+_kernel$'
  - fellow: tilelang-fellow
    language: tilelang
    patterns: ['^main_kernel$']
  - fellow: ck-fellow
    language: ck
    patterns: ['^mfma_', 'cshuffle', 'ck_tile', '^_ZN2ck', 'GridwiseMoeGemm']
  - fellow: hip-fellow
    language: hip
    patterns: ['^_ZN5aiter', '^void aiter::', 'topk_transform', 'anonymous namespace']

# Operator category, used as the logical_operator seed. First match wins.
categories:
  - category: moe_gemm
    patterns: ['moe', 'MoE', 'expert', 'grouped_gemm']
  - category: attention
    patterns: ['attention', 'attn', 'flash_', 'mha', 'mla', '_fwd_kernel', 'paged']
  - category: gemm
    patterns: ['gemm', 'Gemm', 'GEMM', 'hgemm', 'matmul']
  - category: layernorm
    patterns: ['rmsnorm', 'layernorm', 'layer_norm', 'norm_quant']
  - category: router
    patterns: ['topk', 'top_k', 'routing', 'sorting']
  - category: elementwise
    patterns: ['elementwise', 'silu', 'gelu', 'activation', 'mul_kernel']
  - category: copy
    patterns: ['Copy', 'copy', 'cat_', 'Cat']
  - category: kv_cache
    patterns: ['kv_cache', 'kvcache', 'cache_kernel', 'reshape_and_cache']

# dtype recovery from the symbol name. The 6-column CSV carries shapes but not
# dtypes; AMD kernel names frequently encode them. Longest token wins, so
# `bf16` does not shadow `afp4_wfp4_bf16`.
#
# `a` prefix = activation, `w` prefix = weight, bare = output/compute.
dtype_tokens:
  afp4: {role: activation, dtype: fp4}
  wfp4: {role: weight, dtype: fp4}
  afp8: {role: activation, dtype: fp8}
  wfp8: {role: weight, dtype: fp8}
  a16: {role: activation, dtype: bf16}
  w16: {role: weight, dtype: bf16}
  a8w8: {role: both, dtype: fp8}
  mxfp4: {role: both, dtype: mxfp4}
  mxfp8: {role: both, dtype: mxfp8}
  bf16: {role: compute, dtype: bf16}
  fp16: {role: compute, dtype: fp16}
  fp32: {role: compute, dtype: fp32}
  f16: {role: compute, dtype: fp16}
  DF16b: {role: compute, dtype: bf16}
