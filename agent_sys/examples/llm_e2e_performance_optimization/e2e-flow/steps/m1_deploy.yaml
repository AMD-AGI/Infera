# Stage 1 — deploy.
#
# The kind, its wiring and its place in the graph are contract (CONTRACT.md §1)
# and do not move. Everything else here is m1's.
#
# Definition order is load-bearing within a file: agent, validators, kind, leaf,
# non-leaf.

# --------------------------------------------------------------------------- #
# 1. The agent.
#
# `kind: ai`, and the skeleton's `agent: runner` is replaced rather than kept,
# because a bring-up is judgement work: pick free ports on a shared host, read
# the repository's own examples, watch a log repeat `Health check failed` for
# four minutes and decide that is a JIT compile rather than a hang. None of that
# is a command somebody already wrote — and the moment it is, this closure should
# be demoted to a program.
#
# **What the AI is not doing is inventing a method.** Mission G4.2.1 puts the
# ordered commands and their acceptance criteria in
# `assets/deploy_and_prove.task/readme.md`'s STEPS section; this agent sequences
# them and reads what comes back.
#
# `backend_entry` is the dotted form rather than an entry-point name: a task
# package outside this repository cannot register an entry point in the
# `agent_sys.backends` group without being installed, and this package is data.
#
# **No `env` block here.** `shared.yaml` is this package's only variable
# declaration site by design, and every `E2E_*` name this task reads is declared
# there. A second `env` block would be a second place for a default to go stale.
# No credential is written here or anywhere else in this package: model
# credentials reach a body from the operator's own settings allow-list, by name,
# through `env_mgr.harness.harness_env`.
- module: agent
  name: e2e_deployer
  kind: ai
  version: '1'
  description: Turns a plain deployment instruction into a proven bring-up and a runnable delivery kit.
  # **No `skills:`, and that is a change from `../deploy-demo`.** That package
  # declared the packup skill because the skill was the authority for the kit's
  # layout. Here the authority is `assets/schemas/deploy_kit.layout.yaml` — that
  # is the whole of M1.1 — and the readme quotes it. Declaring the skill as well
  # would give the agent two authorities that can disagree, and it would add a
  # required `--var packup_skill=<path>` whose only honest value is one
  # operator's home directory.
  #
  # If a site does want the skill in the zone, add `skills: ['${packup_skill}']`
  # here and pass the var: `env_mgr` redirects `CLAUDE_CONFIG_DIR` into the zone
  # and a session reads skills from `$CLAUDE_CONFIG_DIR/skills/`, so a skill only
  # arrives if it is declared.
  backends:
    - key: claude_code_sdk
      backend_entry: agent.backends.claude_sdk:ClaudeSdkBackend
      err: the claude backend needs `pip install -e "agent_sys[claude]"`

# --------------------------------------------------------------------------- #
# 2. The validators. Neither carries a `kind:` key — `validator.schema.json` has
# no such field and `additionalProperties: false`. The two are told apart by
# `tags.logic_source` and `tags.cost`, which is the pair a phase is ordered by:
# cheapest first, so a malformed kit fails in seconds instead of after a bring-up.
#
# Both are **program** validators (G4.1: 能程序化的，尽量不用 ai).

# M1.1. Every rule it applies is read from `assets/schemas/deploy_kit.layout.yaml`
# at run time; the body holds none of its own. `args.layout` names that file, so
# a package standardising on a different layout re-points it rather than forking
# the validator.
#
# The five checks mission M1.1 asks to be carried across from `../deploy-demo`
# are all in that yaml — `served_name_not_a_path`, `mode_readback`,
# `completion_evidence`, `results/` `min_files`, `Expected output`. The sixth,
# `environment_facts`, is **replaced** as M1.1.1 asks: the record is
# `codes/environment.yaml` validated against `environment.schema.json`, and
# `environment.md` is checked as a *rendering* of it rather than by three
# regexes over prose.
- module: validator
  name: check_deploy_kit
  version: '1'
  brief: The kit matches the declared layout, its environment.yaml validates, and no identifier bound on a shared host is frozen into it
  dimension: completeness
  strength: strong
  inputs: [deploy_kit]
  args:
    layout: deploy_kit.layout        # assets/schemas/deploy_kit.layout.yaml
  tags:
    logic_source: external_static
    cost: seconds
    domain: [llm_e2e, deploy, m1]

# M1.2.3, the real-run validator: the kit's own `scripts/deploy.sh` brings the
# service up, a **researched** probe set (`probes.yaml`) diagnoses it in several
# directions, and a 1k/1k concurrency-16 three-minute load runs through
# `assets/bench/aiperf_synthetic.sh`.
#
# **Everything site-specific is an `arg`, and that is forced rather than
# chosen.** A validator declares no agent, so this package's `env` block never
# reaches its body — only the policy-derived environment does. Everything the
# *kit* recorded (node, model, image, ports) is read from the kit's own
# `codes/environment.yaml` instead, because the kit is the thing under test.
#
# `cost: gpu_hours` is honest, and it is what puts this validator second.
- module: validator
  name: check_deploy_serves
  version: '1'
  brief: The kit's own scripts bring the service up, it answers the diagnostic probes, and it sustains a 1k/1k conc=16 three-minute load
  dimension: usability
  strength: strong
  inputs: [deploy_kit]
  args:
    layout: deploy_kit.layout
    # How to reach the node, and which one. No defaults for the allocation: a
    # default here is one job's answer shipped as everyone's and it goes stale
    # the hour the job ends.
    transport: '${transport:-auto}'
    jobid: '${jobid}'
    node: '${node}'
    # **Where the transport binary lives.** A validator body is started with a
    # closed environment in which `PATH` is absent, so `sh` substitutes
    # `/usr/bin:/bin` — and `spur` is in `/usr/local/bin`. Without this the call
    # dies `rc=127, spur: command not found`, reported as the *kit's* deploy.sh
    # failing. Measured 2026-09-03; a site fact, so a variable.
    transport_path: '${transport_path:-/usr/local/bin:/usr/local/sbin}'
    # **And what the transport binary itself needs.** Space-separated `K=V`.
    # `spur` reads `SPUR_CONTROLLER_ADDR`; without it, it exits 1 with
    # `failed to connect to controller … Connection refused`, which names the
    # controller and not the missing variable. No default, because a controller
    # address is one cluster's answer — pass
    # `--var transport_env=SPUR_CONTROLLER_ADDR=$SPUR_CONTROLLER_ADDR`.
    transport_env: '${transport_env:-}'
    # The kit's own entrypoints, by the names `deploy_kit.layout.yaml` requires.
    # Arguments rather than literals so a package whose kits are shaped
    # differently re-points them here.
    deploy_entrypoint: '${deploy_entrypoint:-scripts/deploy.sh}'
    teardown_entrypoint: '${teardown_entrypoint:-scripts/teardown.sh}'
    # Where **this** deployment goes. Distinct from the producer's on purpose:
    # the run that produced the kit may still be up, and a validator that takes
    # its ports or its container name breaks the thing it is checking.
    work_root: '${validate_work_root:-/mnt/m2m_nobackup/yihou/e2e_flow/validate}'
    port_base: '${validate_port_base:-8140}'
    # AIPerf runs in its own container: the engine image ships Python 3.10 and
    # AIPerf needs >= 3.11. **Same variable and same default as `shared.yaml`'s
    # `E2E_AIPERF_IMAGE`** — a validator cannot read that block, so the default
    # is repeated here rather than referenced, and the two must be changed
    # together or this validator loads a different AIPerf than m2 does.
    aiperf_image: '${aiperf_image:-nvcr.io/nvidia/ai-dynamo/aiperf:0.12.0}'
    # The load shape, overridable so a wiring run costs seconds. The standard is
    # stated once, in `probes.yaml`; these only override it.
    load_input_tokens: '${deploy_load_in:-1024}'
    load_output_tokens: '${deploy_load_out:-1024}'
    load_concurrency: '${deploy_load_conc:-16}'
    load_seconds: '${deploy_load_seconds:-180}'
    # A cold bring-up of a large model runs to minutes before the server is
    # ready. Slack, not a budget: a timeout here should mean it hung.
    bringup_timeout_seconds: '${deploy_bringup_timeout_seconds:-3600}'
    load_slack_seconds: '${deploy_load_slack_seconds:-900}'
    teardown_timeout_seconds: '${deploy_teardown_timeout_seconds:-600}'
    timeout_seconds: '${deploy_timeout_seconds:-5400}'
  tags:
    logic_source: external_dynamic
    cost: gpu_hours
    domain: [llm_e2e, deploy, m1]

# --------------------------------------------------------------------------- #
# 3. The kind. **One handoff out of stage 1** (M1.2.5) — and in this flow it
# reaches m3 and m4 as well, because it carries the environment record and
# because those stages run things in the container m1 brought up.
#
# `content_type: code`, and the choice was between this and `reproducible`.
# `reproducible`'s required items are `result` and `env`, and `check_items`
# rejects a top-level item the type never declared — so laying a packup into it
# renames every file the layout mandates and destroys the thing
# `check_deploy_kit` exists to check. `code` requires exactly one item, `codes`,
# whose interior is unconstrained, so the kit survives byte for byte with its own
# name on it and `codes/environment.yaml` is where the environment record lives
# (CONTRACT.md §2).
#
# No `items_schema`: it could only restate `codes`, and a closed one would
# additionally reject `logs` and `watchout`, which the `code` type itself lists
# as optional.
- module: handoff
  name: deploy_kit
  version: '1'
  description: One model's proven end-to-end deployment as a runnable kit, carrying the flow's environment record.
  content_type: code
  scope: fixed.required
  validators: [check_environment, check_deploy_kit, check_deploy_serves]

# --------------------------------------------------------------------------- #
# 4. The leaf.
#
# `goal` is capped at 100 characters by `task.schema.json` and is a human label,
# not an instruction channel — everything the agent is told is in
# `assets/deploy_and_prove.task/readme.md`, found by convention from the folder
# name.
#
# **No `resources`.** A leaf may declare a pool and this one legitimately wants
# GPUs, but `cli/build.py` is the only reader and the CLI composition root
# declares no pools, so a `resources` block here would name a pool that does not
# exist.
- module: task
  name: deploy_and_prove
  description: Bring the requested model up end to end on this host and pack the deployment into a runnable kit.
  # **Switchable, and this is the mock mechanism** (mission Brief item 2:
  # "通过 mock ai agent"). A `kind: ai` task does not run `entry.sh` — the
  # backend runs the readme through a model — so promoting this task to `ai`
  # took it off the mock path entirely. Measured: the first full mock run
  # sat at `deploy_and_prove: running` while an AI agent prepared to bring a
  # model up for real, on a node passed in `--var`.
  #
  # `--var m1_agent=runner` swaps in the shared program agent, which does
  # run `entry.sh`, which mocks. The default is the real agent, so a normal
  # run is unchanged and the mock is the thing you have to ask for.
  agent: '${m1_agent:-e2e_deployer}'
  handoffs: [deploy_kit]
  validators: []
  task:
    goal: Deploy the requested model end to end and hand back a runnable kit.
    version: '1'
    repos: [infera, sglang]
    inputs: []
    outputs: [deploy_kit]
    permissions:
      grants:
        - {path: handoffs/deploy_kit, access: write, kind: deploy_kit}

# --------------------------------------------------------------------------- #
- module: task
  name: m1_deploy
  description: Stage 1 — deploy the model and establish the runtime every later stage shares.
  handoffs: [deploy_kit]
  validators: []
  task:
    goal: Deploy the model and establish the shared runtime.
    version: '1'
    inputs: []
    outputs: [deploy_kit]
    permissions:
      grants:
        - {path: handoffs/deploy_kit, access: write, kind: deploy_kit}
    subgraph:
      - {closure: deploy_and_prove, froms: [], is_end: true}
