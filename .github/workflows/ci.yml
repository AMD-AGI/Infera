name: CI

on:
  push:
    branches: ["**"]   # e2e only for code reaching main untested (see e2e_gate)
  pull_request:
    branches: [main]   # e2e runs here, pre-merge — the usual path
  workflow_dispatch:   # manual "Run workflow" button (Actions tab)
    inputs:
      run_e2e_mixed:
        description: "also run e2e-mixed"
        type: boolean
        default: false
      run_e2e_disag:
        description: "also run e2e-disag"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # Classify the change: does it touch package code, or only docs/examples? A
  # docs-only change (manual/, examples/, *.md, LICENSE) skips every code job below (a job skipped by `if`
  # counts as success for required status checks); the manual itself is built
  # and checked by the ReadTheDocs PR integration, so no docs job is needed here.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - id: f
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            range="${{ github.event.before }}...${{ github.sha }}"
          fi
          files=$(git diff --name-only "$range" 2>/dev/null) || files=""
          [ -z "$files" ] && files=$(git diff --name-only HEAD~1 2>/dev/null || true)
          echo "changed files:"; printf '%s\n' "$files"
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # docs / examples / meta — no package code to lint, test, or run on
              # GPU. manual/ is validated by the ReadTheDocs check; examples/ are
              # standalone recipes; *.md / LICENSE are prose.
              manual/*|examples/*|*.md|LICENSE) ;;
              *)        code=true ;;
            esac
          done <<< "$files"
          # Unknown diff (new branch / force-push / empty): be safe, run everything.
          [ -z "$files" ] && code=true
          echo "=> code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Should the e2e tiers run for THIS event? Every PR into main is tested
  # pre-merge, so landing that same code must not test it twice — but "same" has
  # to mean the CONTENT, not the PR: if main moved on while the PR sat open, what
  # lands is a combination no e2e ever saw. Compare git TREES, which are exactly
  # the content, and are equal iff the merge changed nothing versus the PR head.
  e2e_gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tree_of() { gh api "repos/$REPO/commits/$1" --jq .commit.tree.sha 2>/dev/null; }

          run=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            run=true
            echo "pull_request into main — e2e runs pre-merge"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Squash and merge commits both report the PR they came from.
            head=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].head.sha // empty' 2>/dev/null)
            landed=$(tree_of "$SHA")
            tested=""; [ -n "$head" ] && tested=$(tree_of "$head")
            if [ -z "$head" ]; then
              run=true; echo "no PR behind this commit — its code was never e2e'd"
            elif [ -z "$landed" ] || [ -z "$tested" ]; then
              # Never infer "already tested" from a failed lookup: re-testing costs
              # GPU minutes, shipping untested code costs more.
              run=true; echo "could not read both trees — running e2e to be safe"
            elif [ "$landed" = "$tested" ]; then
              echo "tree $landed is what PR head $head already e2e'd — skipping"
            else
              run=true
              echo "tree $landed != PR head $head's $tested — main moved under the PR"
            fi
          else
            echo "not a PR into main, and not a push to main — no e2e"
          fi
          echo "=> run_e2e=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  pre_check:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip.outputs.should_skip }}
    steps:
      - id: skip
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf # v5
        with:
          skip_after_successful_duplicate: "true"
          concurrent_skipping: "never"

  # Sign-off gate for the GPU tiers below — `needs:` cannot reach a job in
  # another workflow, so dco.yml is called here as one. Skipped off a PR (there
  # is nothing to check), which the tiers below read as "did not fail".
  dco:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dco.yml

  lint:
    needs: [pre_check, changes]
    if: >-
      needs.pre_check.outputs.should_skip != 'true' &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - run: pip install pre-commit
      - name: pre-commit (all hooks, all files)
        run: pre-commit run --all-files --show-diff-on-failure

  unit:
    needs: [lint, pre_check, changes]
    # Skip on docs-only changes, and on same-repo PRs (already covered by the
    # branch push event); still run on push and on fork PRs.
    if: >-
      needs.pre_check.outputs.should_skip != 'true' &&
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev,gaie]"
      - name: pytest (unit only)
        run: pytest -m "not slow and not integration" -q

  # Rust router: clippy + unit/integration tests. GH-hosted ubuntu-latest
  # ships a stable toolchain (with clippy), so no toolchain setup is needed.
  rust:
    needs: [lint, pre_check, changes]
    # Skip on docs-only changes, and on same-repo PRs (already covered by the
    # branch push event); still run on push and on fork PRs.
    if: >-
      needs.pre_check.outputs.should_skip != 'true' &&
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: cargo fmt (check)
        run: cargo fmt --all -- --check
      - name: cargo clippy (warnings = errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test

  # Engine GPU tests — run on each branch push (same-repo PRs reuse that run).
  engine:
    # Skip on docs-only changes, and on same-repo PRs (already covered by the
    # branch push event); still run on push and on fork PRs. `!cancelled()` +
    # result checks (not a plain success dependency) so a *skipped* lint/dco — dco
    # does not run off a PR — does not drag this down with it. NOT `always()`:
    # that evaluates true on cancel too, so the job would never be cancelled.
    needs: [lint, pre_check, changes, dco]
    if: >-
      !cancelled() &&
      needs.pre_check.outputs.should_skip != 'true' &&
      needs.changes.outputs.code == 'true' &&
      needs.lint.result != 'failure' && needs.lint.result != 'cancelled' &&
      needs.dco.result != 'failure' && needs.dco.result != 'cancelled' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: [self-hosted, crusoe]
    timeout-minutes: 60
    env:
      INFERA_E2E_SLURM_PARTITION: amd-spur
      INFERA_E2E_MODEL_DIR: /shared_nfs/huggingface_models
      INFERA_E2E_RESERVATION: infera-cicd-reserved
      INFERA_E2E_SLURM_TIME: "00:50:00"
      INFERA_E2E_JOB_TAG: ${{ github.run_id }}-engine
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # exec, so run_tests.sh IS the step's entry process: on cancel the runner
      # signals only that one pid, and a wrapping bash would not forward it, so
      # the script's INT/TERM trap (scancel of the dispatched job) never ran.
      - name: engine tests
        run: exec bash tests/run_tests.sh engine
      - name: reclaim this job's SLURM jobs (on cancel/failure)
        if: always() && (cancelled() || failure())
        run: |
          suf="-${{ github.run_id }}-engine"
          for i in 1 2 3 4 5; do
            ids=$(squeue -h -u "$(id -un)" -o '%i %j' 2>/dev/null \
              | awk -v suf="$suf" '$2 ~ /^infera-ci-/ && substr($2, length($2)-length(suf)+1)==suf {print $1}')
            [ -z "$ids" ] && { echo "no (more) SLURM jobs to reclaim"; break; }
            echo "reclaiming SLURM job(s): $ids (try $i)"; scancel $ids 2>&1 || true
            sleep 5
          done

  # Full PD-mixed e2e (per engine, parallel). When it runs is e2e_gate's call:
  # every PR into main, plus a push that lands untested code on main.
  e2e-mixed:
    # Skipped for docs-only changes. Gated behind lint and dco: run only if neither
    # failed. `!cancelled()` + result checks (instead of a plain success dependency)
    # is needed so e2e still runs when lint is *skipped* as a duplicate (pre_check)
    # or dco is skipped off a PR, but is held back when either fails. NOT
    # `always()`: on cancel the server re-evaluates job-level `if`, and `always()`
    # evaluates true, so the job is never cancelled — it keeps (or even starts)
    # burning GPU nodes after "Cancel workflow".
    needs: [lint, changes, dco, e2e_gate]
    if: >-
      !cancelled() &&
      needs.changes.outputs.code == 'true' &&
      needs.lint.result != 'failure' && needs.lint.result != 'cancelled' &&
      needs.dco.result != 'failure' && needs.dco.result != 'cancelled' &&
      (needs.e2e_gate.outputs.run == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_e2e_mixed))
    strategy:
      fail-fast: false
      matrix:
        engine: [vllm, sglang, atom]
    runs-on: [self-hosted, crusoe]
    timeout-minutes: 120
    env:
      INFERA_E2E_SLURM_PARTITION: amd-spur
      INFERA_E2E_MODEL_DIR: /shared_nfs/huggingface_models
      # Dispatch onto this pre-made reservation's nodes (srun --reservation).
      INFERA_E2E_RESERVATION: infera-cicd-reserved
      # Keep the SLURM allocation just inside the job timeout, so the scheduler
      # reclaims the node even if the runner is killed before it can scancel.
      INFERA_E2E_SLURM_TIME: "01:50:00"
      INFERA_E2E_JOB_TAG: ${{ github.run_id }}-${{ matrix.engine }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # exec: see the engine job — keeps run_tests.sh's INT/TERM trap reachable.
      - name: e2e ${{ matrix.engine }} mixed
        run: exec bash tests/run_tests.sh e2e ${{ matrix.engine }} mixed
      - name: reclaim this job's SLURM jobs (on cancel/failure)
        if: always() && (cancelled() || failure())
        run: |
          # Retry: a single scancel can hit a transient Spur controller error.
          suf="-${{ github.run_id }}-${{ matrix.engine }}"
          for i in 1 2 3 4 5; do
            ids=$(squeue -h -u "$(id -un)" -o '%i %j' 2>/dev/null \
              | awk -v suf="$suf" '$2 ~ /^infera-ci-/ && substr($2, length($2)-length(suf)+1)==suf {print $1}')
            [ -z "$ids" ] && { echo "no (more) SLURM jobs to reclaim"; break; }
            echo "reclaiming SLURM job(s): $ids (try $i)"; scancel $ids 2>&1 || true
            sleep 5
          done

  e2e-disag:
    # Gates mirror e2e-mixed, `!cancelled()` included: `always()` would keep this
    # holding a two-node pair after "Cancel workflow".
    needs: [lint, changes, dco, e2e_gate]
    if: >-
      !cancelled() &&
      needs.changes.outputs.code == 'true' &&
      needs.lint.result != 'failure' && needs.lint.result != 'cancelled' &&
      needs.dco.result != 'failure' && needs.dco.result != 'cancelled' &&
      (needs.e2e_gate.outputs.run == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.run_e2e_disag))
    strategy:
      fail-fast: false
      matrix:
        engine: [vllm, sglang, atom]
    runs-on: [self-hosted, crusoe]
    timeout-minutes: 120
    env:
      INFERA_E2E_SLURM_PARTITION: amd-spur
      INFERA_E2E_MODEL_DIR: /shared_nfs/huggingface_models
      # Ceiling on every disagg srun step, inside the job timeout above so the
      # scheduler reclaims a node even if the runner is killed first.
      INFERA_E2E_SLURM_TIME: "01:50:00"
      # Disagg is many short sruns; the reservation keeps the pair held across
      # them. QoS is left at the cluster default — the harness falls back to the
      # burst QoS by itself if a step is refused for a group node limit.
      INFERA_E2E_RESERVATION: infera-cicd-reserved
      # No ib_peer_mem here, so bare ibv_reg_mr cannot pin VRAM: Mooncake must
      # register via dma-buf, compiled in at build time and selected at run time.
      # The rail is mlx5 (ionic dma-buf dies on a production KV pool); its
      # routable GID is index 3, its 0 and 1 are link-local.
      INFERA_E2E_GID_INDEX: "3"
      INFERA_E2E_WORKER_ENV: MC_TE_FILTERS=mlx5_0,MOONCAKE_DISABLE_HIP_DMABUF=0
      INFERA_E2E_BUILD_ARGS: MOONCAKE_HIP_DMABUF=1
      INFERA_E2E_JOB_TAG: ${{ github.run_id }}-${{ matrix.engine }}-disag
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # exec: see the engine job — keeps run_tests.sh's INT/TERM trap reachable,
      # which is what releases the held node pair on cancel.
      - name: e2e ${{ matrix.engine }} disag
        run: exec bash tests/run_tests.sh e2e ${{ matrix.engine }} disag
      - name: reclaim this job's SLURM jobs (on cancel/failure)
        if: always() && (cancelled() || failure())
        run: |
          # Catches the infera-ci-hold-* pair holder too: it is a -N2 --gres=gpu:8
          # batch job, so a leaked one keeps TWO reserved nodes out of the pool.
          # Retry: a single scancel can hit a transient Spur controller error.
          suf="-${{ github.run_id }}-${{ matrix.engine }}-disag"
          for i in 1 2 3 4 5; do
            ids=$(squeue -h -u "$(id -un)" -o '%i %j' 2>/dev/null \
              | awk -v suf="$suf" '$2 ~ /^infera-ci-/ && substr($2, length($2)-length(suf)+1)==suf {print $1}')
            [ -z "$ids" ] && { echo "no (more) SLURM jobs to reclaim"; break; }
            echo "reclaiming SLURM job(s): $ids (try $i)"; scancel $ids 2>&1 || true
            sleep 5
          done

  unit-torch-cpu:
    needs: [lint, pre_check, changes]
    # Skip on docs-only changes, and on same-repo PRs (already covered by the
    # branch push event); still run on push and on fork PRs.
    if: >-
      needs.pre_check.outputs.should_skip != 'true' &&
      needs.changes.outputs.code == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev]"
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: pytest (CPU tensor logic)
        run: >
          pytest -q
          tests/engine/vllm/test_attention_layout_roundtrip.py
          tests/engine/vllm/test_non_paged_skip.py
          tests/engine/vllm/test_dsa_indexer_roundtrip.py
          tests/engine/vllm/test_vllm_kvd_mla_l3_fullloop.py
