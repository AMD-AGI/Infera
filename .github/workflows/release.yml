name: Build & publish images

# Automated container builds, published to docker.io/inferaimage/infera.
#
# Triggers:
#   * push a version tag (v*.*.*) -> RELEASE build, tag id = the git tag (e.g. v0.1.0)
#   * manual dispatch             -> NIGHTLY build, tag id = <date>-<sha1>
#
# Image ref:  inferaimage/infera:<engine>-<id>
#   release:  inferaimage/infera:sglang-v0.1.0
#   nightly:  inferaimage/infera:sglang-20260711-a1b2c3d
#
# The `overlay` image (deploy/overlay/) is built in its own job after the engine
# images, because it harvests their compiled pieces — see the `overlay` job.
#   inferaimage/infera:overlay-v0.1.0
#
# Target repo defaults to docker.io/inferaimage/infera; override per-run with
# the `image_repo` dispatch input, or repo-wide with the IMAGE_REPO Actions
# variable (input > variable > default). The official repo will be
# docker.io/rocm/infera (set IMAGE_REPO=docker.io/rocm/infera).
#
# Runs on the CI self-hosted pool; that host has no docker, so build+push is
# dispatched to a compute node via srun. Auth: INFERAIMAGE_DOCKERHUB_TOKEN secret.

on:
  push:
    # Only semantic version tags trigger a release build. This keeps ad-hoc /
    # internal tags from kicking off a GPU image build and auto-creating a
    # public GitHub Release (see the `manual` job). Bump the pattern if the
    # versioning scheme changes (e.g. add pre-release suffixes).
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      engines:
        description: "Space-separated engines to build"
        required: false
        default: "sglang vllm atom kvd server"
      id:
        description: "Custom image id (overrides the default <date>-<sha1>)"
        required: false
        default: ""
      image_repo:
        description: "Target repo (default: vars.IMAGE_REPO or inferaimage/infera)"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Turn the (optional) engine list into a JSON matrix. Cheap, runs on GH-hosted.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.set.outputs.engines }}
      overlay: ${{ steps.set.outputs.overlay }}
    steps:
      - id: set
        run: |
          raw="${{ github.event.inputs.engines }}"
          [ -z "$raw" ] && raw="sglang vllm atom kvd server"

          has() { printf '%s\n' $raw | grep -qx "$1"; }
          has overlay && asked_overlay=1 || asked_overlay=0

          # `overlay` is never a matrix entry. It is not an engine: it harvests
          # Mooncake/hipFile out of the vllm and sglang images, so running it
          # beside them would harvest whatever the registry had from a previous
          # run. It gets its own job, gated on `build`. Strip it here so typing it
          # in the dispatch box cannot route it into the matrix.
          engines=$(printf '%s\n' $raw | grep -vx overlay | tr '\n' ' ')
          json=$(printf '%s\n' $engines | jq -R . | jq -sc 'map(select(length>0))')
          echo "engines=$json" >> "$GITHUB_OUTPUT"
          echo "engines=$json"

          # The overlay needs BOTH engine images from THIS run.
          if has sglang && has vllm; then
            echo "overlay=true" >> "$GITHUB_OUTPUT"; echo "overlay=true"
          elif [ "$asked_overlay" = 1 ]; then
            # Explicitly requested but impossible to build correctly. Fail loudly
            # rather than skip: a silent skip on an explicit request reads as
            # "the overlay was published" when nothing was.
            echo "::error::overlay was requested but needs both sglang and vllm in the engine list (got: $raw)"
            exit 1
          else
            echo "overlay=false" >> "$GITHUB_OUTPUT"
            echo "overlay=false (needs both sglang and vllm in the engine list)"
          fi

  build:
    needs: prepare
    # Same runner pool as CI; that host has no docker, so build+push is
    # dispatched to a compute node via srun (.github/scripts/dispatch_build.sh).
    runs-on: [self-hosted, crusoe]
    # auto-docker-builder env unlocks the INFERAIMAGE_DOCKERHUB_TOKEN secret and
    # applies its protection rules (reviewers / wait timer / allowed refs).
    environment: auto-docker-builder
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.prepare.outputs.engines) }}
    env:
      INFERA_E2E_SLURM_PARTITION: amd-spur
      INFERA_E2E_RESERVATION: infera-cicd-reserved
      INFERA_E2E_JOB_TAG: ${{ github.run_id }}-${{ matrix.engine }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve target repo
        env:
          INPUT_REPO: ${{ github.event.inputs.image_repo }}
          VAR_REPO: ${{ vars.IMAGE_REPO }}
        run: |
          repo="${INPUT_REPO:-${VAR_REPO:-docker.io/inferaimage/infera}}"
          echo "IMAGE=$repo" >> "$GITHUB_ENV"
          echo "target repo=$repo"

      - name: Compute image id
        env:
          CUSTOM_ID: ${{ github.event.inputs.id }}
        run: |
          if [ -n "$CUSTOM_ID" ]; then
            echo "ID=$CUSTOM_ID" >> "$GITHUB_ENV"
            echo "channel=custom id=$CUSTOM_ID"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "ID=${{ github.ref_name }}"                 >> "$GITHUB_ENV"
            echo "channel=release id=${{ github.ref_name }}"
          else
            # nightly id: <date>-<tag>-post<N>-<sha1>, e.g. 20260711-v0.1-post5-a1b2c3d
            #   (date first => sorts chronologically; tag+post => which release +
            #    how many commits past it; sha => exact commit). No tag yet in the
            #    repo => fall back to <date>-<sha1>.
            date="$(date -u +%Y%m%d)"
            sha="$(git rev-parse --short HEAD)"
            if desc="$(git describe --tags --long 2>/dev/null)"; then
              gsha="${desc##*-}"; rest="${desc%-*}"    # gsha=g<sha>, rest=<tag>-<N>
              n="${rest##*-}"; tag="${rest%-*}"          # N=distance, tag=<tag>
              id="${date}-${tag}-post${n}-${gsha#g}"
            else
              id="${date}-${sha}"
            fi
            echo "ID=$id" >> "$GITHUB_ENV"
            echo "channel=nightly id=$id"
          fi

      # Token stays in the step env; dispatch_build.sh forwards it to the remote
      # via srun's env propagation (never echoed, never written to disk).
      - name: build & push (remote via srun)
        timeout-minutes: 140
        env:
          INFERAIMAGE_DOCKERHUB_TOKEN: ${{ secrets.INFERAIMAGE_DOCKERHUB_TOKEN }}
        run: .github/scripts/dispatch_build.sh ${{ matrix.engine }}

      - name: reclaim this job's SLURM job (on cancel/failure)
        if: always() && (cancelled() || failure())
        run: |
          suf="-${{ github.run_id }}-${{ matrix.engine }}"
          for i in 1 2 3 4 5; do
            ids=$(squeue -h -u "$(id -un)" -o '%i %j' 2>/dev/null \
              | awk -v suf="$suf" '$2 ~ /^infera-build-/ && substr($2, length($2)-length(suf)+1)==suf {print $1}')
            [ -z "$ids" ] && { echo "no (more) SLURM jobs to reclaim"; break; }
            echo "reclaiming SLURM job(s): $ids (try $i)"; scancel $ids 2>&1 || true
            sleep 5
          done

  # The base-agnostic overlay payload (deploy/overlay/). Unlike the engine
  # images this one is not independent: it builds its Python trees inside the
  # STOCK vendor bases and harvests the compiled pieces out of THIS run's vllm
  # and sglang images, so it must run after `build` and cannot be another entry
  # in that matrix. Skipped when a partial dispatch leaves either engine out.
  overlay:
    needs: [prepare, build]
    if: needs.prepare.outputs.overlay == 'true'
    runs-on: [self-hosted, crusoe]
    environment: auto-docker-builder
    timeout-minutes: 90
    env:
      INFERA_E2E_SLURM_PARTITION: amd-spur
      INFERA_E2E_RESERVATION: infera-cicd-reserved
      INFERA_E2E_JOB_TAG: ${{ github.run_id }}-overlay
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve target repo
        env:
          INPUT_REPO: ${{ github.event.inputs.image_repo }}
          VAR_REPO: ${{ vars.IMAGE_REPO }}
        run: |
          repo="${INPUT_REPO:-${VAR_REPO:-docker.io/inferaimage/infera}}"
          echo "IMAGE=$repo" >> "$GITHUB_ENV"
          echo "target repo=$repo"

      # Same id logic as `build`, so the overlay harvests the engine images this
      # run just pushed rather than whatever happens to be latest.
      - name: Compute image id
        env:
          CUSTOM_ID: ${{ github.event.inputs.id }}
        run: |
          if [ -n "$CUSTOM_ID" ]; then
            id="$CUSTOM_ID"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            id="${{ github.ref_name }}"
          else
            date="$(date -u +%Y%m%d)"; sha="$(git rev-parse --short HEAD)"
            if desc="$(git describe --tags --long 2>/dev/null)"; then
              gsha="${desc##*-}"; rest="${desc%-*}"
              n="${rest##*-}"; tag="${rest%-*}"
              id="${date}-${tag}-post${n}-${gsha#g}"
            else
              id="${date}-${sha}"
            fi
          fi
          echo "ID=$id" >> "$GITHUB_ENV"
          echo "overlay id=$id"

      - name: build & push overlay (remote via srun)
        timeout-minutes: 80
        env:
          INFERAIMAGE_DOCKERHUB_TOKEN: ${{ secrets.INFERAIMAGE_DOCKERHUB_TOKEN }}
        run: .github/scripts/dispatch_build.sh overlay

      - name: reclaim this job's SLURM job (on cancel/failure)
        if: always() && (cancelled() || failure())
        run: |
          suf="-${{ github.run_id }}-overlay"
          for i in 1 2 3 4 5; do
            ids=$(squeue -h -u "$(id -un)" -o '%i %j' 2>/dev/null \
              | awk -v suf="$suf" '$2 ~ /^infera-build-/ && substr($2, length($2)-length(suf)+1)==suf {print $1}')
            [ -z "$ids" ] && { echo "no (more) SLURM jobs to reclaim"; break; }
            echo "reclaiming SLURM job(s): $ids (try $i)"; scancel $ids 2>&1 || true
            sleep 5
          done

  # Build the /manual Sphinx site alongside the images. Always uploads the HTML
  # as a workflow artifact; on a tag (release) it also attaches a tarball to the
  # GitHub Release. No GPU needed, so this runs on a GH-hosted runner.
  #
  # Gated on `build` and `overlay`: don't publish a GitHub Release (create +
  # attach the manual) unless everything this run ships built and pushed, so a
  # green Release never implies images that failed to build. A SKIPPED overlay
  # (partial dispatch, see `prepare`) is fine and must not block the Release —
  # only a FAILED one does, hence the explicit result checks rather than a plain
  # `needs:`, which would also skip this job whenever overlay is skipped.
  # Python distribution. Independent of the image builds -- it needs neither the
  # engine images nor the overlay -- so it does not gate them or wait on them.
  pypi:
    runs-on: ubuntu-latest
    environment: auto-docker-builder
    permissions:
      contents: write   # gh release upload
      id-token: write   # PyPI trusted publishing, when it is configured
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # setuptools_scm derives the version from git describe. A shallow
          # clone has no tags, so the wheel would come out 0.0.0 (the
          # fallback_version) instead of the tag being released.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: Show what was built
        run: |
          ls -la dist/
          echo "--- sdist contents (top level) ---"
          tar tzf dist/*.tar.gz | awk -F/ '{print $2}' | sort -u
      - name: Verify the wheel installs and its console scripts run
        # Catches a broken entry point or a missing runtime dependency here,
        # rather than in the first user's environment.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install dist/*.whl
          /tmp/verify/bin/python -c "import infera, infera._version as v; print('version:', v.version)"
          for c in infera-preflight infera-kvd-probe infera-kvd-l3-bench; do
            /tmp/verify/bin/$c --help > /dev/null || { echo "$c failed"; exit 1; }
            echo "ok: $c"
          done
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
      - name: Publish to PyPI
        # Skipped unless PYPI_API_TOKEN is set. amd-infera has never been
        # published, so claiming the name is a deliberate act, not something a
        # tag push should do by surprise -- and a missing token must not fail
        # the release.
        if: startsWith(github.ref, 'refs/tags/v') && env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  manual:
    needs: [build, overlay]
    if: >-
      always() && needs.build.result == 'success'
      && needs.overlay.result != 'failure'
      && needs.overlay.result != 'cancelled'
    runs-on: ubuntu-latest
    # Same gate as the image build, so publishing a Release (create/upload)
    # goes through the auto-docker-builder protection rules too.
    environment: auto-docker-builder
    permissions:
      contents: write  # gh release create/upload
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # sphinx==9.x needs Python >=3.12 (matches manual/.readthedocs.yaml).
          python-version: "3.12"
      - name: Install graphviz (dot binary for diagrams)
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install Sphinx deps
        run: pip install -r manual/sphinx/requirements.txt
      - name: Build manual (warnings = errors)
        run: make -C manual html
      - uses: actions/upload-artifact@v4
        with:
          name: infera-manual-html
          path: manual/_build/html
      - name: Attach manual to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          tar -czf "infera-manual-${TAG}.tar.gz" -C manual/_build/html .
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Automated release build."
          gh release upload "$TAG" "infera-manual-${TAG}.tar.gz" --clobber
