# Default values for the infera-operator chart. Override image.repository /
# image.tag to pull from your own registry / mirror.

replicaCount: 1

image:
  # Operator manager image. It lives as an `operator-` tag of the shared
  # rocm/infera repo; the chart itself is a separate OCI repo
  # (rocm/infera-operator), so their tags cannot collide.
  repository: docker.io/rocm/infera
  tag: "operator-v0.1.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Leader election lets multiple replicas run with a single active reconciler.
leaderElection:
  enabled: true

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

# RBAC ClusterRole/Binding + ServiceAccount creation.
rbac:
  create: true
serviceAccount:
  create: true
  name: ""

# nodeSelector / tolerations / affinity for the operator pod (control-plane
# friendly defaults: none — schedules anywhere).
nodeSelector: {}
tolerations: []
affinity: {}
