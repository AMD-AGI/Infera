# yaml-language-server: $schema=patches/_schema/patch.upstream.index.schema.json
#
# Every third-party patch this repo carries, grouped by the library it patches.
#
# This file is an INDEX. It holds only what you need to decide whether to open the
# per-patch record: which engines see the patch, why it is still here, and how you will
# find out when it can go. The argument — root cause, upstream state, evidence, call
# chain, verification — lives in the referenced <patch>.upstream.status.yaml, and the
# patch's own header carries the code-level detail.
#
# Validated by scripts/validate-patch-status.py against
# patches/_schema/patch.upstream.index.schema.json, which also cross-checks that every
# patch on disk has a record and that the totals below match. A patch added without a
# record fails the lint gate.
#
# Replaces patch.upstream.status.md (removed in the same change).
schema_version: 1
status_updated: 2026-08-07

verification_note: >-
  Every row was re-established on 2026-08-05: patch header read, `gh` queried for the
  live state of each PR and issue, and for the rows where a search found nothing, upstream
  `main` read directly through the contents API. What is NOT covered: no image was built
  or inspected, so the four rows whose effect depends on what the pinned base already
  carries are marked `unverified` in their records rather than guessed at. Treat any row
  whose status_updated has drifted far from today as a prompt to re-check, not as fact.
  UPDATED 2026-08-07: the three sglang rows that had no PR of ours now have one —
  #33968 (hicache allocator), #33970 (mooncake wait event), #33973 (DSA host-sync, the
  2a half only). All three are DRAFTS: they were re-validated for equivalence and scope
  against the proven local fix on MI300X, but the MI355X / multi-node cluster was
  unreachable, so none has been re-run against the original fault on the hardware that
  reproduces it. Do not read `carry-upstream-pr-open` on those rows as "fixed upstream".
  Full record: pr.done.md and work.todo.md at the repo root.

