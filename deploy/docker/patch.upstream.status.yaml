maintenance:
  drop_rule: >-
    A patch is ready to delete when its upstream fix is merged AND present in the pinned base.
    Merged-but-not-in-base still needs the local patch — sglang#30265, Mooncake#2644/#2543 and
    rocm-systems#7386 are all that case. Two rows do not fit the rule's shape at all: the staged
    write-back drops on sglang#30350 because its MERGED sibling #28534 is what INTRODUCED the
    defect, and the Mooncake diffs drop on the pin advancing rather than on any merge.
  add_rule: >-
    A new patch needs a <prefix>.upstream.status.yaml beside it and an entry here, or
    scripts/validate-patch-status.py fails the lint gate. If a file under patches/ carries no fix
    of its own, list it under not_patches instead.
  warnings:
    - >-
      Six patches cannot announce their own obsolescence. Anything with drop_signal
      base-version-only or pin-advance-only keeps applying cleanly after upstream has fixed the
      problem, so only the pinned version tells you. Review those on every base bump.
    - >-
      A self-guard marker that keys on text UPSTREAM added — not on text we add — prints
      "already patched" on a fixed base. That is safe but indistinguishable from success in the
      build log. patch_vllm_mooncake_blocksize.py and patch_moriio_write.py are both this shape.
    - >-
      Dockerfile.vllm's patch loop swallows sys.exit(1) into "[vllm-patch] skipped", so a genuine
      failure and a benign no-op look the same. Read the per-layer build log when bumping the base.
    - >-
      Four patches carry silent correctness bugs — wrong output, no crash, no log line:
      patch_mooncake_early_send_wait_event.py, patch_moriio_pagelen.py,
      patch_gdn_pd_state_transfer.py, and patch_vllm_mooncake_blocksize.py. Never assume a smoke
      test covers these; three of them pass one.
    - >-
      HIPFILE_GIT_REF is unpinned, so images from the same infera commit can contain different
      hipfile code depending on the build date. That is a reproducibility problem in its own right.
