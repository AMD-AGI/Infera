problem:
  what: >-
    With chunked prefill over the mooncake KV transport, every prefill chunk except the
    last can be RDMA-read while the forward that writes those pages is still running, so
    the decode leg receives half-written KV.
  why: >-
    prefill.py's early-send path already records a completion event as the barrier
    (req.disagg_kv_sender._early_send_wait_event), and the comment there says exactly
    what it is for — but only mori/conn.py ever reads it. mooncake/conn.py has no
    wait_event or synchronize() anywhere, so on mooncake the barrier has never taken
    effect. Worse, the overlap-scheduling path that actually moves non-final chunks
    (process_batch_result_disagg_prefill) does not even record an event. The final chunk
    is always correct because it goes through the sampling path, which has a real
    copy_done.synchronize().
  how: >-
    Three edits, all mirroring what mori already does. TransferKVChunk gains a
    wait_event field so the barrier travels with the work item; mooncake's send() picks
    the event up off the sender, add_transfer_request() forwards it, and transfer_worker
    synchronizes on it BEFORE reading device memory; and prefill.py's overlap non-final
    chunk send records an event on forward_stream.
  before_fix: >-
    No crash and nothing in any log — output is PARTIALLY wrong for prompts longer than
    one prefill chunk. On GLM-5.2 DSA needle-in-a-haystack returns the first digits of
    the needle then degenerates: want=2183762 got='2183</think>2183</think>218</think>'.
    The corruption boundary lands exactly on the chunk boundary.
  after_fix: >-
    Needle retrieval 5/9 -> 9/9 and a 29k depth sweep 4/9 -> 9/9, with logs confirming
    the failing prompt is still really split into 4 chunks afterwards (so the fix is a
    barrier, not an accidental disabling of chunking).
  context: >-
    2x 8x MI325X (gfx942), ROCm 7.2.0, sglang v0.5.16, GLM-5.2-FP8 1P1D over mooncake
    RDMA, overlap scheduling ON, --chunked-prefill-size 131072, --enable-dp-attention.
    NOT DSA-specific: any PD deployment running chunked prefill over mooncake with
    overlap scheduling is affected. The same model, same backends and same chunk size in
    an aggregated single-node server passes 9/9, which is the A/B that localises it to
    the transport.
  call_chain:
    - "sglang/srt/disaggregation/prefill.py :: process_batch_result_disagg_prefill (overlap path)"
    - "send_kv_chunk(..., last_chunk=False) — no event recorded on this path"
    - "sglang/srt/disaggregation/mooncake/conn.py :: send() -> add_transfer_request()"
    - "transfer_worker reads device memory with no synchronize() — races the forward still writing those pages"
  symptom_signature: >-
    partially-correct long-prompt output with the error boundary on the prefill chunk
    boundary; no log line, no crash
  silent: true

verification:
  date: 2026-07-31
  hardware: 2x 8x MI325X (gfx942)
  software: sglang v0.5.16, ROCm 7.2.0
  workload: GLM-5.2-FP8 1P1D over mooncake RDMA, overlap scheduling on, chunked prefill 131072
  result: needle 5/9 -> 9/9; 29k depth sweep 4/9 -> 9/9; chunk count unchanged at 4
  notes: >-
    DSA's sparse retrieval only makes this conspicuous ("retrieved half the digits");
    on a dense model the same defect is a quiet quality drop.

    Re-validated 2026-08-24 on 2x 8x MI355X (gfx950), crsuse2-m2m-237 (prefill TP8) +
    crsuse2-m2m-106 (decode TP8 + DP-attention + MTP), GLM-5.2-FP8, mooncake over mlx5_0
    (RoCE v2 GID 3, mode B dma-buf), resolved chunked_prefill_size 131072, against
    sglang#33970 head 3c2cb3ab03. Needle probe, 200k-token prompt, 7 depths, same seeds
    both arms: STOCK non-final 1/4 and final 3/3; PATCHED non-final 4/4 and final 3/3.
    The failures partition exactly on the chunk boundary and the final-chunk control is
    3/3 on BOTH arms, so the patch moved outcomes only where the defect is claimed to be.
    Failure shape matches this patch's own header signature independently
    ('831</think>831</think>8</think>...' here vs '2183</think>2183</think>...' recorded
    there). Arms differ only in the three files, enforced by a wait_event count guard
    (stock=0, patched=9) that aborts on mismatch.

    synchronize() COST, previously unmeasured: sglang.bench_serving through the router,
    ISL 32768 / OSL 256, concurrency 8, n=24 per arm. request throughput 0.4497 -> 0.4478
    (-0.42%), output throughput 115.12 -> 114.64 (-0.42%), mean TTFT 11928.6 -> 11997.1 ms
    (+0.57%), mean TPOT 13.254 -> 13.082 ms (-1.30%, i.e. better), 24/24 completed on both.
    No measurable regression — all deltas within ±1.3% and not pointing the same way.
    Caveats: one run per arm at n=24 (excludes a large regression, not a sub-1% effect);
    a 200 Gb/s link, where the barrier is a smaller share of a longer transfer than it
    would be on the 8x400 Gb/s rails; concurrency 8.

    Rebase note: unlike the other two PRs this one CONFLICTED on current main. Upstream
    moved the staging_counted block earlier in transfer_worker, so the patch's hunk (which
    inserted wait_event just before it) no longer applied. Resolved by keeping only the
    wait_event block; verified the synchronize still precedes batch_transfer_sync.
    Artifacts: pr-verify.experiment/rounds/r03-newcluster/.

