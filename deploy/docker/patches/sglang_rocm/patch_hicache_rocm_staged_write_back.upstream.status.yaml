problem:
  what: >-
    Two gates decide one thing and disagree on ROCm, so the hicache controller puts the
    destination indices on the GPU while the MLA pool launches the JIT kernel that
    requires them on the host. The first write-back kills the scheduler.
  why: >-
    pool_host/mla.py opts HIP into the staged write-back JIT
    (`(_is_cuda or _is_hip) and can_use_write_back_jit_kernel(...)`), and pool_host/mha.py
    carries the identical enablement — #28534 did both. But the pools that can share a
    HostPoolGroup with them do not: DSAIndexerPoolHost, which any DSA model such as
    GLM-5.2 always instantiates alongside the MLA pool, plus DeepSeekV4PagedHostPool and
    DeepSeekV4StateHostPool, still gate on _is_cuda alone and read False on ROCm.
    HostPoolGroup ANDs the flag over its entries, so one CUDA-only member makes the
    group flag False while its ANCHOR entry — the MLA pool — still says True. The two
    then feed different decisions: hybrid_cache_controller.start_writing() reads the
    GROUP flag, concludes the JIT will not run, and calls move_hybrid_indices() so the
    destination indices end up on the GPU; HostPoolGroup.backup_from_device_all_layer()
    delegates to the ANCHOR pool, whose own flag is True, so the JIT launches anyway.
  how: >-
    Make the anchor agree with the group: gate the staged JIT on CUDA only, exactly as
    the three CUDA-only pools already spell it. The MLA pool then falls through to
    transfer_kv_all_layer_mla_lf_pf — the non-JIT kernel in the same branch, which
    asserts its destination indices ARE on the GPU, which is where the controller just
    put them. Both gates read False on ROCm and the two decisions match.
  before_fix: >-
    "tvm.error.InternalError: Tensor match failed for Tensor<1152>[strides=<1>,
    dtype=int64, device=rocm:0] at jit_kernel/csrc/kvcacheio/staged_write_back.cuh:248 -
    Root cause: Device value [rocm:0] not in the allowed options: [cpu, rocm_host]" and
    "Subprocess scheduler_0 crashed with exit code -3", on the first write-back after the
    first reusable prefix.
  after_fix: >-
    The gfx942 image serves kvd. On any model that reaches this crash the fix costs
    nothing that worked before: DSAIndexerPoolHost is CUDA-gated, so the group flag was
    already False on ROCm for every DSA model and the staged JIT was unreachable
    regardless.
  context: >-
    MI300X (gfx942), ROCm 7.2.0, sglang v0.5.16, GLM-5.2-FP8, DSA attention, dp8, with
    --hicache-mem-layout page_first --hicache-io-backend kernel (both defaults). Not
    specific to kvd: any hierarchical cache on this path dies the moment it writes a
    page back, so the engine survives startup and then crashes on the first real request.
  call_chain:
    - "hybrid_cache/hybrid_cache_controller.py :: start_writing() reads the GROUP flag (False on ROCm) -> move_hybrid_indices() puts dst indices on the GPU"
    - "HostPoolGroup.backup_from_device_all_layer() delegates to the ANCHOR pool"
    - "mem_cache/pool_host/mla.py :: backup_from_device_all_layer reads its OWN flag (True) -> launches the JIT"
    - "jit_transfer_hicache_all_layer_mla_staged_lf_pf -> staged_write_back.cuh:248 TensorMatcher rejects device=rocm:0"
  symptom_signature: "Device value [rocm:0] not in the allowed options: [cpu, rocm_host]"
  silent: false

verification:
  date: 2026-08-04
  hardware: MI300X (gfx942)
  software: sglang v0.5.16 and current upstream main copies, ROCm 7.2.0
  workload: GLM-5.2-FP8, DSA, dp8, hicache page_first + kernel io-backend
  result: >-
    Exercised against the v0.5.16 AND current-main copies of both files on throwaway
    trees. Stock: applies, exit 0. Re-run: "already applied", exit 0. #30350 simulated by
    flipping the three CUDA-only gates: refuses, exit 1, with mla.py byte-identical to
    pristine. pool_host/mla.py removed (the v0.5.15.post1 shape): tolerated, exit 0.
    Anchor or pool renamed: exit 1.
  notes: >-
    The five-case exercise is the point — a patch whose drop signal is a precondition
    check is only trustworthy if the refusal path is tested.

scope_limits: >-
  This patch gates pool_host/mla.py ONLY. DSAIndexerPoolHost is not the only CUDA-only
  member that can poison the group's AND: build_deepseek_v4_hicache_stack puts
  DeepSeekV4PagedHostPool in a group anchored by LogicalHostPool, whose flag is
  unconditionally True, so expect the same crash on a V4 hicache stack on gfx942. No V4
  stack runs on this branch, so that gate would be untested; the script's SCOPE section
  records it for whoever gets there. #30350 does cover the V4 pools.

