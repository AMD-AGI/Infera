    surface: Dockerfile.sglang (gfx950 / MI355X, v0.5.15.post1)
    effect: no-op
    required_to_run: false
    evidence: >-
      Nothing to fix on this base: every can_use_write_back_jit gate at v0.5.15.post1 is
      still _is_cuda (MHA, MLA, both V4 pools and DSAIndexerPoolHost, all in
      memory_pool_host.py), and _is_hip appears only in the kernel import guard, so the
      group's AND and its anchor agree on False. pool_host/mla.py does not exist and the
      script exits 0 on that.

alive_because:
  reason: upstream-pr-open
  detail: >-
    The upstream repair is #30350, which is OPEN with CHANGES_REQUESTED. Note the
    inversion: the MERGED PR here (#28534) is what INTRODUCED the disagreement, so this
    patch does not drop on a merge — it drops on #30350. #28534's own reasoning argues
    for the opposite repair, teaching the remaining pools the JIT rather than gating MLA
    down, so upstream will likely close this differently than we did.
  consumers:
    - Dockerfile.sglang.gfx942 (kvd / hierarchical cache — required to serve at all)
  drop_when: >-
    A base sglang stops gating DSAIndexerPoolHost on _is_cuda alone — i.e. #30350 or an
    equivalent lands. check_group_still_poisoned() tests that precondition and refuses.
  drop_signal: precondition-check-refuses
  silent_misapply_risk: >-
    Anchor drift cannot be the signal here. #30350 never touches pool_host/mla.py, so
    our anchor would keep matching and the patch would keep applying on top of the fix.
    That is not a crash — both gates read False again — but it silently forfeits the
    staged kernel #30350 enables. Hence the precondition check rather than an anchor
    check: once DSAIndexerPoolHost stops gating on _is_cuda alone, the script exits 1 and
    tells the operator to drop it.

