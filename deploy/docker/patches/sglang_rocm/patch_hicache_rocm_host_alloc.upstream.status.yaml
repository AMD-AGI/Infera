problem:
  what: >-
    sglang allocates every hierarchical-cache host pool with anonymous mmap +
    hipHostRegister, then stores the resulting HOST virtual addresses in a device-side
    pointer table that a GPU kernel dereferences. On ROCm those host VAs are not
    dereferenceable from the device.
  why: >-
    On CUDA, cudaHostRegister maps the pages at the SAME address in the device address
    space, so a host VA is directly usable from a kernel. On ROCm, hipHostRegister maps
    them at a DIFFERENT device address which you must obtain via
    hipHostGetDevicePointer. Measured on gfx950 / ROCm 7.2.0 with an 8 MiB buffer:
    pin_memory gives host==devPtr, while mmap+hipHostRegister gives
    host=0x7d3bee790000 devPtr=0x7d3bede00000 — and every register-flag variant
    (Mapped, Portable|Mapped, MAP_PRIVATE) also differs. gfx950 reports xnack-, so
    there is no page-migration path to paper over it.
  how: >-
    Register ROCm in ALLOC_MEMORY_FUNCS to use alloc_with_pin_memory — torch
    pin_memory=True, hipHostMalloc underneath — which returns memory whose device
    pointer IS the host pointer. Exactly what the existing "npu" and "musa" entries do,
    for the same reason. This is the smallest change that makes the existing
    pointer-table design correct on ROCm; translating every host pointer through
    hipHostGetDevicePointer is the right upstream shape but touches roughly ten call
    sites and is not something to apply blind to a running container.
  before_fix: >-
    "Memory access fault by GPU node-2 (Agent handle: ...) on address <host VA>. Reason:
    Unknown." on the first kvd write-back. The fault address equals the host pointer
    exactly, which is the fingerprint.
  after_fix: >-
    Standalone repro of the exact write-back kernel — 78 layers, 7.33 GB host indexer
    buffer, page ranges head / tail / last — goes from a fault on every mmap variant to
    ALL OK with pin_memory.
  context: >-
    gfx950 / MI355X, ROCm 7.2.0, sglang hierarchical cache with a DSA model
    (DSAIndexerPoolHost). MI300X measures the two addresses equal, so the fault is
    gfx950-only so far. Cost of the fix: the hugepage path in alloc_mmap
    (SGLANG_HUGEPAGE_SIZE) is bypassed on ROCm; that env var is unset here.
  call_chain:
    - "sglang/srt/mem_cache/pool_host/common.py :: ALLOC_MEMORY_FUNCS[device] -> alloc_with_host_register"
    - "alloc_mmap(dims, dtype) then cudaHostRegister(buffer.data_ptr(), n, 0)"
    - "memory_pool_host.py :: DSAIndexerPoolHost.init_kv_buffer builds index_k_data_ptrs from host data_ptr()s on the GPU"
    - "transfer_kv_all_layer_mla(dst_layers=self.index_k_data_ptrs, ...) — kernel dereferences a host VA"
  symptom_signature: "Memory access fault by GPU node-N ... on address <host VA>"
  silent: false

verification:
  date: 2026-08-03
  hardware: MI355X (gfx950, xnack-) and MI300X (amdgpu 6.14.14) for the negative control
  software: ROCm 7.2.0, sglang v0.5.15.post1
  workload: standalone repro of the hicache write-back kernel, 78 layers, 7.33 GB host indexer buffer
  result: mmap+hipHostRegister faults on every variant; pin_memory is clean on all page ranges
  notes: >-
    The address-equality measurement is the cheap way to tell whether a given arch is
    affected — run it before assuming a new GPU needs this.

scope_limits: >-
  Fixes the allocator, not the design. The pointer tables still hold raw host pointers;
  any future pool that builds a device-side table the same way is correct only because
  pin_memory happens to return matching addresses.

