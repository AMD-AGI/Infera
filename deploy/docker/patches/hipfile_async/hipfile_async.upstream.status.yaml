problem:
  what: >-
    The ROCm hipFile Python binding exposes no async API, and the obvious Cython
    implementation of one is unsafe: out-parameters passed as `&local` die before the driver
    dereferences them.
  why: >-
    Cython stack locals passed by address to an asynchronous driver call go out of scope when
    the Python frame returns, while the driver writes to them later. The write then lands on
    reclaimed stack, so bytes_done reads 0 and HipFileException 5022 appears
    intermittently — a lifetime bug, so it is timing-dependent and looks flaky.
  how: >-
    Add write_async / read_async, Stream and supports_async() to the binding, and keep the
    driver's out-parameter slots on the HEAP: the wrapper calls libhipfile.so via ctypes with
    heap-allocated c_size_t / c_int64 / c_ssize_t slots that outlive the call.
  before_fix: >-
    No async API at all; a naive Cython binding gives bytes_done == 0 and intermittent
    HipFileException 5022.
  after_fix: >-
    Async stream I/O works and bytes_done is correct, which is what kvd's gpu-direct L3 load
    path needs.
  context: >-
    ROCm hipFile Python bindings, used by kvd's gpu-direct L3. Built into Dockerfile.vllm
    from a clone of ROCm/rocm-systems, so the effective target is whatever that default
    branch holds at build time.
  call_chain:
    - "hipfile/file.py :: write_async / read_async"
    - "_hipfile.pyx passes &local out-parameters to the async driver call"
    - "the Python frame returns; the driver writes to reclaimed stack"
    - "bytes_done reads 0 / HipFileException 5022"
  symptom_signature: "HipFileException 5022 with bytes_done == 0, intermittently"
  silent: false

verification:
  date: 2026-07-20
  hardware: AMD ROCm with hipFile / AIS
  software: ROCm hipfile python bindings from ROCm/rocm-systems
  workload: kvd gpu-direct L3 async read/write
  result: Async I/O completes with correct bytes_done; the intermittent 5022 is gone.
  notes: >-
    Also note the neighbouring trap in the same build step: a missing ais-check probe
    SILENTLY downgrades the kvd load path to CPU-bounce, which is why Dockerfile.vllm asserts
    `test -x /opt/rocm/bin/ais-check`.

scope_limits: >-
  A local implementation, superseded upstream by a better one. It should not be carried
  forward on its own merits.

open_actions:
  - action: >-
      Delete this patch. It is ours, merged upstream on 2026-07-16, the target is unpinned so
      the fix arrives by itself, and upstream's implementation is the better of the two.
    owner: unassigned
    blocked_on: null
  - action: >-
      Separately, pin HIPFILE_GIT_REF. An unpinned default-branch clone makes image contents a
      function of the build date; that is a reproducibility problem regardless of this patch.
    owner: unassigned
    blocked_on: null
