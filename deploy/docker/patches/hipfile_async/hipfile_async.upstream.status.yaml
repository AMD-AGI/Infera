  versions:
    - surface: Dockerfile.vllm (build_hipfile.sh)
      ref: unpinned-default-branch
      commit: null
      pinned_ref_on_main: true
      release_branch: null
      unpinned_risk: >-
        This is the important fact about this patch. build_hipfile.sh defaults
        HIPFILE_GIT_REF to empty, i.e. HEAD of the ROCm/rocm-systems default branch, so the
        target moves on every build with no record of what was built. Since #7386 merged on
