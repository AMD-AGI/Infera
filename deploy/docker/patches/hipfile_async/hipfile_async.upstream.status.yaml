        means this patch is expected to be a no-op on any fresh build today, and the image
        content depends on the build DATE rather than on anything in this repo.
      images: []

upstream_main_affected:
  value: false
  evidence: >-
    ROCm/rocm-systems#7386 is MERGED (2026-07-16) and lands the same feature on the same
    four files this patch edits, with the same root-cause account of the pointer-lifetime
    bug. The default branch therefore carries the API.

applies_to:
  - engine: vllm
    surface: Dockerfile.vllm (BUILD_HIPFILE=1, step 4)
    effect: unverified
    required_to_run: false
    evidence: >-
      Effect depends on the build date, not on the repo: the script greps the cloned tree
      for the hipFileStreamRegister marker and skips if present. Any build after 2026-07-16
      clones a tree that has #7386, so this is very likely a no-op now — but nothing in the
      repo records which it was for a given image, so it cannot be asserted either way.

alive_because:
  reason: released-but-infera-not-bumped
  detail: >-
    Ours, merged upstream on 2026-07-16, and the target is unpinned — so upstream's fix
    arrives on its own the next time anyone builds. This is not really "alive" so much as
    "not yet deleted". Note the two implementations differ in HOW they keep the driver's
    out-parameters alive, so this is merged-but-not-equivalent: upstream owns the slots in a
    Cython AsyncIOHandle cdef class, while this patch sidesteps Cython and calls
    libhipfile.so through ctypes with heap-allocated c_size_t / c_int64 / c_ssize_t slots.
    Upstream's is the better shape.
  consumers:
    - >-
      none, most likely — only a build pinned to a rocm-systems tree older than #7386 would
      still need it
  drop_when: >-
    Now, in practice: the base image's /opt/rocm-systems-src/projects/hipfile carries #7386
    on any fresh clone. Confirm with one grep for hipFileStreamRegister and delete.
  drop_signal: self-guard-marker-skips
  silent_misapply_risk: >-
    The marker grep makes the skip safe, so there is no misapply risk. The real risk is the
    opposite and worth stating plainly: because HIPFILE_GIT_REF is unpinned, two images built
    from the same infera commit on either side of 2026-07-16 contain DIFFERENT hipfile code —
    one with our ctypes implementation, one with upstream's Cython one. That is an
    unreproducible build, independent of whether the patch is kept.

