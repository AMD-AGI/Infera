problem:
  what: >-
    In MoRIIO WRITE (push) mode the decode sends the block-allocate notification to ITSELF,
    the consumer-side handler asserts, the notify thread dies and the request hangs.
  why: >-
    The decode calls get_peer_zmq_from_request_id(..., is_producer=True), which resolves to
    the producer — itself. The receiving handler asserts get_role() == PRODUCER ("Only
    prefill can get block messages") and raises, killing the moriio-notify thread. The
    decode must address the PREFILL, i.e. is_producer=False.
  how: >-
    One-token change: is_producer=True -> is_producer=False at the single call site, guarded
    on the occurrence count being exactly 1 so a layout change fails rather than guesses.
  before_fix: The request hangs and the client sees HTTP 000; the notify thread is dead.
  after_fix: WRITE-mode PD requests complete.
  context: >-
    MoRIIO WRITE (push) mode only. PULL (read) mode never takes this branch and does not
    need the patch.
  call_chain:
    - "moriio_connector.py :: decode sends block-allocate notification"
    - "get_peer_zmq_from_request_id(request.request_id, is_producer=True) -> resolves to self"
    - "consumer handler asserts get_role() == PRODUCER -> moriio-notify thread dies"
    - "request hangs, HTTP 000"
  symptom_signature: '"Only prefill can get block messages" followed by a hung request / HTTP 000'
  silent: false

verification:
  date: 2026-07-20
  hardware: AMD ROCm 2-node PD
  software: vLLM ROCm image, MoRIIO WRITE mode
  workload: MoRIIO push-mode PD request
