alive_because:
  reason: released-but-infera-not-bumped
  detail: >-
    Fixed upstream on source (main and v0.22.1rc0) but historically absent from every
    published AMD ROCm image, which is why the patch exists at all. Our base has since moved
    to v0.25.1, so the likely truth is that this is now redundant — a drop candidate whose
    only blocker is that nobody has looked.
  consumers:
    - >-
      possibly none on the v0.25.1 base; required on any ROCm image at v0.22.1 or earlier
      running MoRIIO WRITE (push) mode
  drop_when: >-
    The pinned base is confirmed to carry is_producer=False.
  drop_signal: self-guard-marker-skips
  silent_misapply_risk: >-
    The guard is `if new in src` — i.e. it keys on the FIXED text, so on a fixed base it
    reports "already patched" and exits 0. Safe, but the build log line reads like success
    rather than like redundancy. Note the sharper edge: if upstream ever ships a base with
    a DIFFERENT count of is_producer=True occurrences, the script exits 1, which the
    Dockerfile's patch loop swallows into "[vllm-patch] skipped" — so a real failure is
    indistinguishable from a benign skip in the log.

