problem:
  what: >-
    MoRIIO's MLA transfer path derives the per-block transfer SIZE and STRIDE from the
    tensor shape rather than from the authoritative page size, so block-scaled fp8 MLA
    caches move the wrong bytes and PD output is silently wrong.
  why: >-
    get_layer_transfer_geometry's MLA (3-dim) branch computes slot_size_bytes = latent_dim *
    element_size, block_len = block_size * slot_size_bytes and block_stride = stride[0].
    The authoritative per-scheduler-block page is spec.page_size_bytes, and the
    shape-derived values disagree with it in two independent ways. For DeepSeek-V4
    fp8_ds_mla (UE8M0 block-scaled, 576-byte aligned) the page is PADDED, so page_size_bytes
    > block_size*inner*es and the dropped tail is exactly the per-block scale — decode
    dequantizes with a stale scale, so facts garble while structure survives. For GLM-5.1
    the cache is laid out per KERNEL block of size 1 (shape[1] == 1, ~1.25M blocks) while
    the scheduler pages at block_size 16, so the shape-derived values are 16x too small and
    only 1/16 of each block moves, to the wrong offset — total garbage.
  how: >-
    Use spec.page_size_bytes, which is both alignment-aware and kernel/logical-block-ratio
    aware. block_stride is in ELEMENTS, so it becomes page_size_bytes // element_size.
    This is what Mooncake already does, which is why Mooncake PD is correct on the same
    nodes and model — that differential is how the bug was localised.
  before_fix: >-
    DSv4 gives right structure with wrong facts ("The capital of France is" -> "a good
    idea..."); GLM-5.1 gives total garbage ("is is is is..."). READ and WRITE modes fail
    identically, and prefill queried directly is correct.
  after_fix: >-
    Verified 2026-07-22 on TP4 2-node MoRIIO PD at temp=0: DSv4-Pro France->Paris,
    China->Beijing, PD output equal to prefill-direct. GLM-5.1-FP8 likewise correct.
  context: >-
    TP4 2-node MoRIIO PD, DeepSeek-V4 and GLM-5.1 (block-scaled fp8 MLA + DSA lightning
    indexer, --kv-cache-dtype fp8). Byte-for-byte no-op for contiguous matched-block caches
    (fp16/bf16 K/V — Qwen, Kimi), where page_size_bytes == stride[0]*es ==
    block_size*inner*es. The K/V (5-dim) branches are untouched; they already handle the
    ratio via kernel_blocks_per_block.
  call_chain:
    - "moriio_layout.py :: get_layer_transfer_geometry (MLA 3-dim branch)"
    - "slot_size_bytes = latent_dim * element_size; block_len = block_size * slot_size_bytes; block_stride = stride[0]"
    - "MoRIIO transfer moves block_len bytes at block_stride elements — disagrees with spec.page_size_bytes"
    - "decode attends over partially-transferred / mis-scaled KV"
  symptom_signature: >-
    PD output wrong while prefill-direct is correct; DSv4 right-structure/wrong-fact,
    GLM-5.1 degenerate repetition
  silent: true

verification:
  date: 2026-07-22
  hardware: TP4 across 2 nodes
  software: vLLM v0.25.1, MoRIIO connector
  workload: DSv4-Pro and GLM-5.1-FP8 MoRIIO PD, temp=0
  result: >-
    DSv4-Pro France->Paris and China->Beijing with PD == prefill-direct; GLM-5.1-FP8
    correct. Diagnosed by differential against Mooncake on the same nodes plus live
    per-layer geometry instrumentation.
  notes: >-
    The Mooncake differential is the transferable technique here: two connectors on the
    same nodes and model, one correct, isolates the defect to the transport layer.

scope_limits: >-
  MLA (3-dim) branch only. The K/V (5-dim) branches already handle the kernel/logical ratio
  and are deliberately untouched.

