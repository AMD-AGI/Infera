problem:
  what: >-
    Some attention backends force a KERNEL block size of 1 even when the user pins
    --block-size 16. The KV tensor is then allocated at per-token granularity while the
    scheduler still hands the connector LOGICAL page block_ids, so the connector's
    address arithmetic is off by the ratio.
  why: >-
    The stock connector registers num_blocks = cache.shape[0] and block_len =
    stride(0)*elemsize. When cache.shape[0] == num_logical_pages * ratio, the address
    base + page_id*block_len lands `ratio` times too early. Affected backends are ROCm
    Aiter MLA and the DeepSeek-V3.2 / GLM-5.1 DSA lightning indexer.
  how: >-
    Mirror vLLM's NIXL connector: compute ratio = logical_block_size // kernel_block_size
    in _sync_block_size_with_kernel and register at logical-page granularity
    (num_blocks //= ratio, block_len *= ratio). ratio == 1 for dense and matched-block
    models, so this is byte-for-byte inert there.
  before_fix: >-
    RDMA transfers empty rows, the decode engine attends over all-zero prompt KV and
    emits garbage from the first token. The transfer also overflows, producing
    "destination transfer region exceeds remote KV block size".
  after_fix: GLM-5.1 fp8 mooncake PD produces correct output from the first token.
  context: >-
    Observed with GLM-5.1 fp8 over mooncake PD. Applies to any backend that forces
    kernel block size 1; no-op for dense or matched-block models.
  call_chain:
    - "mooncake_connector.py :: register_kv_caches -> num_blocks = cache.shape[0], block_len = stride(0)*elemsize"
    - "scheduler hands LOGICAL page block_ids"
    - "base + page_id*block_len lands ratio x too early -> empty rows transferred"
  symptom_signature: "destination transfer region exceeds remote KV block size"
  silent: false

