problem:
  what: >-
    The Mooncake connector's register_kv_caches() destructures every MambaSpec layer as a
    2-tuple, so any Mamba-family layer that carries a different number of state tensors
    kills KV registration on every rank.
  why: >-
    `conv, _ = cache_or_caches` encodes Mamba2's shape (conv state, SSM state) as if it
    were the contract. It is not: MambaSpec.shapes is already a variable-length tuple of
    shapes, so the two-tensor assumption belongs to the connector, not the spec. Kimi-K3
    uses KDA linear attention, whose layers carry a different count.
  how: >-
    Take the first state tensor — exactly what the original code kept — without
    constraining how many follow: `cache_list = [cache_or_caches[0]]`.
  before_fix: >-
    "mooncake_connector.py:1678 in register_kv_caches / conv, _ = cache_or_caches /
    ValueError: too many values to unpack (expected 2)", on every rank simultaneously
    during KV registration, so PD never starts.
  after_fix: Kimi-K3 registers KV and PD starts.
  context: >-
    Kimi-K3 with KDA linear attention over Mooncake PD. Mamba2 models were never
    affected, which is why the assumption survived.
  call_chain:
    - "mooncake_connector.py :: register_kv_caches"
    - "isinstance(layer_spec, MambaSpec) -> conv, _ = cache_or_caches"
    - "KDA layer carries != 2 state tensors -> ValueError on every rank"
  symptom_signature: "ValueError: too many values to unpack (expected 2)"
  silent: false

verification:
  date: 2026-08-02
  hardware: AMD ROCm multi-node PD
  software: vLLM v0.25.1 base with the Mooncake connector
