problem:
  what: >-
    Under concurrent PD load the decode EngineCore dies on
    `assert req_id in self.requests` in scheduler._update_from_kv_xfer_finished — a
    KV-transfer-finished event arrives for a request that has already been removed.
  why: >-
    The scheduler assumes a KV-transfer-finished event can only refer to a live request.
    It can't guarantee that: the request can be aborted, freed, or completed between the
    transfer being issued and the event arriving, and both the recving and sending paths
    have the same assumption.
  how: >-
    Skip the stale event with a warning instead of asserting, at both call sites. This is
    explicitly a symptom guard, not a repair — the racing request still loses its KV
    transfer.
  before_fix: The decode EngineCore process dies, taking the deployment down mid-run.
  after_fix: >-
    The engine stays up and logs "KV xfer finished for unknown req <id> (recving/sending);
    skipping stale event". The affected request is still wrong.
  context: >-
    Concurrent PD load on vLLM. Applied for THROUGHPUT runs where correctness checking is
    off; it must not be applied to correctness tests, which should surface the race.
  call_chain:
    - "vllm/v1/core/sched/scheduler.py :: _update_from_kv_xfer_finished"
    - "finished_recving / finished_sending event for a req_id already removed from self.requests"
    - "bare assert -> EngineCore process death"
  symptom_signature: "assert req_id in self.requests"
  silent: false

verification:
  date: 2026-07-20
  hardware: AMD ROCm multi-node PD
  software: vLLM
  workload: concurrent PD throughput
  result: EngineCore survives; the stale event is logged and skipped.
  notes: >-
    "Works" here means the process stays up, which is the whole intent and also the whole
    limitation.

scope_limits: >-
  Does NOT fix the underlying correctness race — the racing request still loses its KV
  transfer. Apply for throughput runs; leave it off for correctness runs so the race
  stays visible.

open_actions:
  - action: >-
      Decide whether to pursue the real fix upstream. Three open issues and no PR means
      the race is unowned; a proper repair would be a genuine contribution where this
      guard would not.
    owner: unassigned
    blocked_on: null
