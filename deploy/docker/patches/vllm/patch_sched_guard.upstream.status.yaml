alive_because:
  reason: no-upstream-pr
  detail: >-
    Three independent upstream issues describe this exact assert and all three are OPEN
    with no PR against any of them. Nobody has fixed it upstream, ourselves included —
    though in our case that is defensible, because what we carry is a symptom guard and
    not a fix, and upstreaming a symptom guard would be the wrong contribution.
  consumers:
    - Dockerfile.vllm and the overlay payload, for PD throughput runs
  drop_when: >-
    Upstream replaces the assert with real handling of late KV-transfer-finished events —
    which means fixing the race, not guarding it.
  drop_signal: self-guard-marker-skips
  silent_misapply_risk: >-
    This patch converts a crash into a warning while the underlying race still loses the
    racing request's KV transfer. Carrying it on a correctness run therefore HIDES a
    correctness defect. That is the risk here — not that the patch becomes stale, but that
    it is applied on a run whose purpose is to surface what it suppresses.

