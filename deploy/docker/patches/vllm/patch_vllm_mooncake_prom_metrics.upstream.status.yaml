problem:
  what: >-
    MooncakeConnector implements get_kv_connector_stats but not build_prom_metrics, so
    under MultiConnector the Prometheus registration contract is violated and the engine
    dies on the first stats collection after the first request.
  why: >-
    Without its own build_prom_metrics, MooncakeConnector inherits the base classmethod
    that returns None. MultiConnector.build_prom_metrics only registers children whose
    build_prom_metrics returns non-None, so Mooncake never lands in the registry — and
    then MultiKVConnectorPromMetrics.observe asserts that every child IS registered.
    Reachable only under MultiConnector; a single-connector setup never takes that path.
  how: >-
    Add a build_prom_metrics returning a no-op observe() adapter, mirroring
    InferaKvdPromMetrics. It invents no counters and alters no existing metric — Mooncake's
    transfer telemetry already flows through get_kv_connector_stats, so only the
    registration contract needs satisfying. Doing this at image-build time rather than
    monkey-patching from infera's Python at run time is deliberate: the runtime approach
    loses an import-order race, because MultiConnector calls Mooncake's build_prom_metrics
    before the infera module that would patch it is imported. Editing the vendored file
    removes the race entirely.
  before_fix: >-
    "AssertionError: MooncakeConnector is not contained in the list of registered
    connectors with Prometheus metrics support: dict_keys([...])" and the engine dies.
  after_fix: >-
    PD + kvd-L3 runs with engine metrics on, so the vllm:*prefix_cache_* counters and
    kvd's L3 telemetry are visible — they were never missing, just gated behind engine
    metrics being enabled at all.
  context: >-
    Exactly the PD + kvd-L3 recipe: MultiConnector(InferaKvdConnector + MooncakeConnector)
    with engine metrics enabled. Unreachable with a single connector, and unreachable with
    --disable-log-stats, which is how the Kimi-K2.6 benchmarks worked around it.
  call_chain:
    - "MultiConnector.build_prom_metrics -> registers only children returning non-None"
    - "MooncakeConnector inherits the base build_prom_metrics -> None -> never registered"
    - "MultiKVConnectorPromMetrics.observe asserts every child is registered -> engine dies"
  symptom_signature: "MooncakeConnector is not contained in the list of registered connectors with Prometheus metrics support"
  silent: false

