alive_because:
  reason: no-upstream-pr
  detail: >-
    Nothing upstream, and nothing of ours. This one is also the hardest to upstream honestly:
    what we carry is a reordering that AVOIDS a crash whose mechanism is not fully explained
    — the None return from one TP worker's compile_or_warm_up_model is a symptom we routed
    around rather than diagnosed.
  consumers:
    - >-
      Dockerfile.vllm and the overlay payload, for high-util Mooncake PD with bare
      ibv_reg_mr registration (MOONCAKE_HIP_DMABUF=0)
  drop_when: >-
    The high-util boot crash is diagnosed properly and fixed at its cause, or a base vLLM
    stops aggregating compilation_times in a way that a None can kill.
  drop_signal: self-guard-marker-skips
  silent_misapply_risk: >-
    The patch reorders when registration happens. If a future base changes the warmup
    sequence such that the deferred point is no longer before the engine reports ready, P/D
    pairing could break in a way this record's "registration still completes before ready"
    claim would no longer cover. The anchors are narrow enough that a rewrite of that
    function drops the patch rather than misplacing it, but the invariant is worth re-checking
    on a base bump rather than assumed.

