problem:
  what: >-
    With bare ibv_reg_mr registration, registering the Mooncake KV pool at its normal point —
    inside gpu_model_runner.initialize_kv_cache, before compile_or_warm_up_model — trips a
    decode-boot crash at high GPU utilisation.
  why: >-
    Not fully established, and this record should not pretend otherwise. The observable is
    that one TP worker's compile_or_warm_up_model returns None, and vLLM's
    `max(t.language_model for t in compilation_times)` aggregation then dies on it. Why
    early registration makes that worker return None is unexplained; the working theory is
    memory pressure from the pinned pool during warmup, which is consistent with it being
    util-dependent but is not proven.
  how: >-
    Move the Mooncake register_kv_caches call to the very END of compile_or_warm_up_model,
    after all warmup, cudagraph capture and the post-capture sampler/pooler dummy runs.
    gpu_model_runner stashes the caches and the transfer group on self instead of registering;
    gpu_worker performs the registration at the end. Registration still completes before the
    engine reports ready, so P<->D pairing is unaffected.
  before_fix: >-
    "AttributeError: 'NoneType' object has no attribute 'language_model'" during decode boot
    at high util.
  after_fix: >-
    Kimi-K2.6 at --gpu-memory-utilization 0.8 boots stably and DeepSeek-V4-Pro output is
    correct, confirming the deferral does not break pairing or transfer.
  context: >-
    Reachable with bare ibv_reg_mr GPU registration (MOONCAKE_HIP_DMABUF=0, the default,
    with host-libionic injection) at high --gpu-memory-utilization. Not observed at lower
    util.
  call_chain:
    - "gpu_model_runner.py :: initialize_kv_cache -> kv_transfer_group.register_kv_caches(kv_caches)"
    - "gpu_worker.py :: compile_or_warm_up_model — one TP worker returns None"
    - "max(t.language_model for t in compilation_times) -> AttributeError on the None"
  symptom_signature: "AttributeError: 'NoneType' object has no attribute 'language_model'"
  silent: false

verification:
  date: 2026-07-20
  hardware: AMD ROCm multi-node PD
  software: vLLM with the Mooncake connector, bare ibv_reg_mr registration
  workload: Kimi-K2.6 at --gpu-memory-utilization 0.8, and DeepSeek-V4-Pro for correctness
  result: >-
    Boot crash cleared and DSv4-Pro output correct, which is the check that the deferral did
    not break pairing.
  notes: >-
    Validating correctness as well as boot was the right instinct: a reordering of KV
    registration is exactly the kind of change that could boot fine and transfer nothing.

scope_limits: >-
  A workaround, not a fix — it changes WHEN registration happens, not why early registration
  breaks warmup.

