problem:
  what: >-
    MoRIIO asks the generic ROCm backend selector for a backend name purely to fill a P/D
    handshake tag, and for DSv4 sparse MLA that query raises and kills the prefill worker.
  why: >-
    The generic selector returns ROCM_AITER_MLA_SPARSE, which does not support fp8_ds_mla, so
    get_attn_backend() raises. The irony is that the return value is only used as a handshake
    STRING — nothing dispatches on it — so a fatal query is being made for a cosmetic purpose.
  how: >-
    For DSv4 sparse MLA specifically (use_mla and hf_config.index_topk and cache_dtype
    fp8_ds_mla), skip the generic query and set backend_name directly to
    ROCM_FLASHMLA_SPARSE_DSV4. Every other model keeps the original path. The old code is
    matched verbatim so drift skips loudly rather than mis-patching.
  before_fix: >-
    get_attn_backend() raises during MoRIIO setup and the prefill worker dies, so DSv4 sparse
    MLA PD never starts.
  after_fix: DSv4-Pro serves over MoRIIO 1P1D with the correct handshake tag.
  context: >-
    DeepSeek-V4-Pro sparse MLA (fp8_ds_mla, index_topk) with MoRIIOConnector 1P1D on ROCm,
    verified on vllm 0.23.x.
  call_chain:
    - "moriio_connector.py :: setup -> get_attn_backend(...) to obtain backend_name"
    - "generic ROCm selector returns ROCM_AITER_MLA_SPARSE, which lacks fp8_ds_mla -> raises"
    - "prefill worker dies"
  symptom_signature: get_attn_backend raising for fp8_ds_mla during MoRIIO handshake setup
  silent: false

