problem:
  what: >-
    MoRI's register_torch_tensor rejects DeepSeek-V4's KV cache because it is a non-contiguous
    view, and the obvious workaround — calling .contiguous() — would be silently wrong.
  why: >-
    DSv4's fp8_ds_mla KV cache is a 576-byte-aligned non-contiguous view over a larger buffer.
    register_torch_tensor forces contiguity and raises. .contiguous() would copy to a NEW
    address, so the registered memory would no longer be the buffer the model forward writes
    into — registration would succeed and transfers would move stale data.
  how: >-
    For a non-contiguous tensor, register the storage span through the low-level
    register_memory(data_ptr, storage_nbytes - storage_offset_bytes, dev, loc), using the same
    base that _compute_block_transfer_offsets already uses so the offset arithmetic stays
    consistent. Contiguous tensors keep the original path. This mirrors sglang's mori connector.
  before_fix: >-
    register_torch_tensor raises on the non-contiguous DSv4 KV view, so registration fails.
  after_fix: DSv4-Pro registers its KV cache and MoRIIO 1P1D serves.
  context: >-
    DeepSeek-V4-Pro (fp8_ds_mla, 576B-aligned non-contiguous KV view) with MoRIIO on ROCm,
    verified on vllm 0.23.x. Contiguous fp16/bf16 caches are unaffected.
  call_chain:
    - "moriio_engine.py :: register_torch_tensor(kv_view)"
    - "non-contiguous 576B-aligned fp8_ds_mla view -> raises"
    - "(.contiguous() would copy to a new address, detaching from the forward's buffer)"
  symptom_signature: register_torch_tensor rejecting a non-contiguous tensor at MoRIIO registration
  silent: false

verification:
  date: 2026-07-20
  hardware: AMD ROCm 1P1D
  software: vllm 0.23.x ROCm, MoRIIOConnector
  workload: DeepSeek-V4-Pro MoRIIO PD
  result: Registration succeeds against the live forward buffer.
  notes: >-
    The .contiguous() trap is the transferable lesson: it would have "worked" and moved stale
    KV, which is far worse than the exception.

scope_limits: Non-contiguous registration only; contiguous tensors keep the stock path.

