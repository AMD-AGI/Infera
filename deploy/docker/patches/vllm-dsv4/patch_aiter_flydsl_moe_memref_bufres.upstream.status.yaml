problem:
  what: >-
    vLLM passes tensors into aiter's flydsl 2-stage MoE GEMM, which arrive as flydsl memrefs,
    and aiter 0.1.16's fx.ptrtoint rejects memrefs — the kernel build dies with an MLIRError.
  why: >-
    The gemm1/gemm2 buffer-resource construction was changed to go through fx.ptrtoint, which
    assumes a raw pointer. A memref is not one, so the conversion raises during MLIR
    construction rather than at a type boundary where it would be obvious.
  how: >-
    Revert the gemm1/gemm2 buffer-resource builds to the memref-friendly buffer_ops calls
    (create_buffer_resource / extract_base_index). gemm3 is deliberately untouched.
  before_fix: MLIRError crash in the 2-stage MoE GEMM on Kimi-K2.6 int4 W4A16.
  after_fix: The MoE GEMM builds and runs. No-op for DSv4 MXFP4, which does not take this path.
  context: >-
    Kimi-K2.6 int4 W4A16 MoE on ROCm. Verified against aiter 0.1.16.post2 with flydsl 0.2.0 on
    a vLLM dev748 base — note that BOTH of those differ from what Dockerfile.vllm builds today.
  call_chain:
    - "vLLM MoE layer passes tensors to the aiter flydsl 2-stage GEMM"
    - "aiter/ops/flydsl/kernels/moe_gemm_2stage.py :: _ptr_buffer_resource -> fx.ptrtoint(ptr)"
    - "ptr is a flydsl memref -> MLIRError during MLIR construction"
  symptom_signature: MLIRError from fx.ptrtoint in moe_gemm_2stage
  silent: false

verification:
  date: 2026-07-20
  hardware: AMD ROCm
  software: aiter 0.1.16.post2, flydsl 0.2.0, vLLM dev748
  workload: Kimi-K2.6 int4 W4A16 MoE
