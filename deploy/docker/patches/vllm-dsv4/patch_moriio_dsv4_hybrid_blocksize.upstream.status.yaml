problem:
  what: >-
    A global block_size equality check in the MoRIIO connector kills the prefill worker at KV
    registration for DeepSeek-V4, which legitimately registers per-layer caches with different
    block sizes.
  why: >-
    The connector asserts `first_geometry.block_size == self.block_size` and raises on any
    per-layer mismatch, but DSv4's KV geometry is hybrid by design — c128a sparse layers use
    block size 2 while SWA and state layers use 256. The check is spurious because the actual
    offset arithmetic already consults the per-layer self.block_lens dict, so nothing
    downstream depends on the global equality.
  how: >-
    Drop the global assert and demote the per-layer mismatch raise to a debug log, leaving the
    per-layer offset path untouched.
  before_fix: The prefill worker dies at KV registration, so DSv4 MoRIIO PD never starts.
  after_fix: DSv4-Pro serves over MoRIIO 1P1D.
  context: >-
    DeepSeek-V4-Pro with MoRIIOConnector 1P1D on ROCm; verified on vllm 0.23.x. Only hybrid
    per-layer block-size models reach the check.
  call_chain:
    - "moriio_connector.py :: register_kv_caches"
    - "assert first_geometry.block_size == self.block_size (global check)"
    - "per-layer mismatch raise"
    - "prefill worker dies before serving"
  symptom_signature: block_size assertion at MoRIIO KV registration on a hybrid-KV model
  silent: false

verification:
