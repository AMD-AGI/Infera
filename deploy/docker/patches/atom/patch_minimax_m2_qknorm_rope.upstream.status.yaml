problem:
  what: >-
    The stock atom/models/minimax_m2.py in the base image fails to load, and its TP fused
    QK-norm all-reduce kernel is unsafe for large batches.
  why: >-
    Two independent problems. (A) The model file passes dtype= to get_rope(), but the installed
    rope API does not accept it, so import raises a TypeError — the model file and the rope
    module in the same image are out of sync. (B) The TP fused QK-norm all-reduce kernel does not
    hold for large batches, so it needs a size guard rather than being taken unconditionally.
  how: >-
    Two minimal, independently guarded hunks: (A) drop the dtype= kwarg from the get_rope call;
    (B) guard the fused kernel with qkv.shape[0] <= 256 so larger batches fall back to the manual
    fp32 QK-norm path. Each hunk is applied only if its exact, unique pre-image is present, and
    a missing or non-unique pre-image skips that hunk with a loud warning instead of editing code
    the patch does not recognise.
  before_fix: TypeError from get_rope() at model load — MiniMax-M2 cannot start.
  after_fix: >-
    MiniMax-M2 loads and runs. Correct OUTPUT additionally requires the triton/unified attention
    backend, which is selected at launch (ATOM_USE_UNIFIED_ATTN=1 plus --block-size 64 in
    models/minimax_m27.conf) and is not this patch's job.
  context: >-
    MiniMax-M2 on the rocm/atom 0.1.4 base image. Nothing model-agnostic here — both hunks are
    specific to minimax_m2.py.
  call_chain:
    - "atom/models/minimax_m2.py imported at model load"
    - "get_rope(..., dtype=getattr(quant_config, 'torch_dtype', None)) -> TypeError"
    - "(separately) TP fused QK-norm all-reduce kernel taken unconditionally for any batch size"
  symptom_signature: "TypeError from get_rope() during MiniMax-M2 model load"
  silent: false

verification:
  date: 2026-07-20
  hardware: AMD ROCm
  software: ATOM 0.1.4 base image
  workload: MiniMax-M2 model load and serve
  result: >-
    Model loads and runs. Coherent output needs the unified attention backend selected at launch,
    which is configured separately.
  notes: >-
    Worth keeping the two concerns distinct: this patch makes the model START; the launch config
    makes it CORRECT. Conflating them has previously led to blaming the patch for output quality.

scope_limits: >-
  Makes MiniMax-M2 start. It does not make its output correct — that needs
  ATOM_USE_UNIFIED_ATTN=1 and --block-size 64 from models/minimax_m27.conf.

