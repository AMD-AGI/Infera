problem:
  what: >-
    In the Mooncake PD KV-transfer consumer, start_load_kv reads consumer_staging_pool_idx on a
    path where it was never bound, so the decode worker dies with an UnboundLocalError on the
    first PD request.
  why: >-
    The variable is bound only inside the `if self._has_slot_regions:` branch but referenced
    unconditionally when recording a pending recv slot. Hybrid models that use cache-group slot
    state but do NOT register slot_regions — Qwen3.5's GDN linear-attention layout, where
    local_slot_index >= 0 while _has_slot_regions is False — take the else path and hit the
    unbound read.
  how: >-
    Initialise consumer_staging_pool_idx = -1 at the top of the per-request loop. The WRITE_DONE
    release path is already guarded by `if pool_idx >= 0:`, so -1 is safe and simply skips the
    staging scatter and release for the block-only path.
  before_fix: >-
    "UnboundLocalError: cannot access local variable 'consumer_staging_pool_idx'" and the decode
    worker crashes on the first PD request.
  after_fix: The decode worker survives and the block-only path skips staging cleanly.
  context: >-
    ATOM Mooncake PD with a hybrid model that has cache-group slot state but no registered
    slot_regions. Models that do register slot_regions never take the failing path.
  call_chain:
    - "atom/kv_transfer/disaggregation/mooncake/mooncake_connector.py :: start_load_kv"
    - "consumer_staging_pool_idx bound only inside `if self._has_slot_regions:`"
    - "else path records a pending recv slot and reads it anyway"
    - "UnboundLocalError kills the decode worker on the first PD request"
  symptom_signature: "UnboundLocalError: cannot access local variable 'consumer_staging_pool_idx'"
  silent: false

verification:
