problem:
  what: >-
    GLM-5.2's MTP (nextn) layer is entirely bf16/unquantized, but sglang's quark
    exclude check does not recognise it as excluded, so eh_proj is built as an MXFP4
    (uint8) parameter and the draft weight-load fails.
  why: >-
    The quark quantization_config lists exclude entries at SUBMODULE level
    ('model.layers.<N>.eh_proj'), while DeepseekV3ForCausalLMNextN probes the BARE layer
    prefix ('model.layers.<N>'). should_ignore_layer() therefore returns False, the
    layer is treated as quantized, and nextn_quant_config is not cleared.
  how: >-
    Probe the eh_proj submodule — an exact exclude entry — instead of the bare layer, so
    the match succeeds, nextn_quant_config becomes None, and the whole bf16 MTP layer is
    built bf16.
  before_fix: >-
    "AssertionError: param.shape=[6144,6144] uint8 vs loaded_weight.shape=[6144,12288]
    bf16" during draft weight-load — reported on the status page previously as
    '3072 vs 6144'.
  after_fix: Coherent GLM-5.2 MTP output on the v0.5.15.post1 base.
  context: >-
    gfx950 / MI355X, sglang v0.5.15.post1, GLM-5.2 with quark MXFP4 weights and EAGLE
    MTP. Not reachable on v0.5.16+, which carries #30265.
  call_chain:
    - "sglang/srt/models/deepseek_nextn.py :: DeepseekV3ForCausalLMNextN.__init__"
    - "should_ignore_layer(mapped_prefix, quant_config.exclude_layers) — probes the bare layer prefix"
    - "eh_proj built as an MXFP4 uint8 param"
    - "draft weight-load shape assertion fails"
  symptom_signature: "param.shape=[6144,6144] uint8 vs loaded_weight.shape=[6144,12288] bf16"
  silent: false

