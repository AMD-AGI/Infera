  date: 2026-08-01
  hardware: 8x MI355X (gfx950)
  software: sglang v0.5.15.post1, ROCm 7.2.0
  workload: GLM-5.2-FP8 PD, DP-attention + EAGLE MTP
  result: Deadlock and assert both cleared; every consumer of the removed mirrors walked by hand.
  notes: >-
    2a2's removals were established dead by reading each consumer: extend_prefix_lens_cpu
    is read only inside the is_extend() arm, seq_lens_sum at the is_extend()-gated
    capacity check, indexer_seq_lens_cpu is already None here, and both
    _cal_indexer_k_start_end and dsa_indexer's k-only path open with
    is_extend_without_speculative().

