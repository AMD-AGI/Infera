problem:
  what: >-
    Two independent defects in dsa_backend.py, both on the PD decode leg with MTP.
    (2a) A blocking device-to-host sync sits on a branch only SOME DP ranks take, so
    the DP collectives desynchronize and the group deadlocks. (2b) The page table has
    one row per REQUEST while top-k has one row per TOKEN, so an assert kills every
    rank.
  why: >-
    2a — `max_seqlen_k = int(forward_batch.seq_lens.max().item())` is a host sync, and
    idle DP peers keep their host mirror and take the cheap arm, so the ranks do not
    issue the same collective sequence. Two further unconditional `.cpu()` syncs on the
    same branch have to go too; with the first fix alone the hang persists.
    2b — `metadata.page_table_1` is per-request, while `topk_indices` has just been
    padded to `q.shape[0]`, i.e. per-token. Equal for plain decode, unequal under MTP.
  how: >-
    2a — replace the sync with the sync-free `self.req_to_token.shape[1]`. Over-
    allocating page-table columns is safe: the table is only indexed THROUGH top-k,
    which masks per row by cache_seqlens, so extra columns get -inf and are never
    selected. The idiom is already established in-tree three times (triton_backend.py,
    trtllm_mha_backend.py, and DSA's own graph path). The removed `.cpu()` mirrors are
    dead for DRAFT_EXTEND_V2, which is not is_extend(), so every consumer is
    unreachable. 2b — expand the page table with repeat_interleave to reproduce the
    token-major layout, at BOTH decode call sites; the rows `_pad_topk_indices` added
    hold all -1 and the triton kernel already masks them, so only the row COUNT has to
    match.
  before_fix: >-
    2a — the whole DP group hangs with no error. 2b — `assert page_table.shape[0] ==
    topk_indices.shape[0]` in transform_index_page_table_decode_fast, and every rank
    dies.
  after_fix: >-
    GLM-5.2 DSA serves PD with DP-attention and EAGLE MTP on gfx950. Both bytecode
    markers assert clean in the build.
  context: >-
    gfx950 / MI355X, sglang v0.5.15.post1, GLM-5.2 DSA, PD disaggregation, DP-attention
    with EAGLE MTP. The traceback for 2b named only the first decode call site; the
    second pairs the same unpadded page table with a padded topk_indices, so both are
    patched. The prefill sibling solves 2b with an explicit output_num_tokens; the
    decode entry point has no equivalent.
  call_chain:
    - "dsa_backend.py :: init_forward_metadata (decode, DRAFT_EXTEND_V2)"
    - "2a: seq_lens.max().item() — host sync on a DP-divergent branch"
    - "2b: transform_index_page_table_decode_fast — asserts page_table rows == topk rows"
  symptom_signature: "assert page_table.shape[0] == topk_indices.shape[0]"
  silent: false

