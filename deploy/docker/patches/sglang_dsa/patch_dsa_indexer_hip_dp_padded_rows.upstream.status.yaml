problem:
  what: >-
    The aiter (HIP) paged-MQA branch of the DSA lightning indexer sizes its logits
    output from one row count while `lengths` is sized from the other, so fast_topk_v2
    is handed a score tensor and a lengths tensor that disagree.
  why: >-
    Under DP-attention the two counts diverge in BOTH directions. When q_fp8 carries DP
    padding the real count is smaller, which is the case every CUDA backend already
    handles by taking a q_offset= and slicing internally; ROCm's aiter entry point has
    no such parameter, so nothing slices. On a DP-idle rank under MTP draft-extend the
    inequality inverts: q_offset (= sum of dsa_extend_len_cpu) is 2 while only 1 row is
    materialized in q_fp8, so there are FEWER query rows than lengths entries and a
    trim cannot help.
  how: >-
    Reconcile both counts to min(real, padded). When q_fp8 is the longer side, trim
    q/weights to the real count and restore the padding after topk_transform — the
    contract the CUDA backends already honour. When q_fp8 is the shorter side, clip the
    lengths instead, through topk_transform's existing ke_offset parameter. `_p1v2_clip`
    and `_p1v2_rows` are bound BEFORE the is_aiter() test because the former is read
    unconditionally at the topk_transform call.
  before_fix: >-
    RuntimeError "Expected lengths.size(0) == B to be true, but got false" — on gfx950
    at the very first batch, on gfx942 at concurrency > 1. In the inverted (P1V3)
    direction the scheduler rank dies and the router drops to `active_workers: 1`.
  after_fix: >-
    GLM-5.2 DSA runs with DP-attention and EAGLE MTP on both bases. The debug hook
    SGLANG_DEBUG_DSA_ROWS=1 shows the reconciled counts, including the idle-rank case
    mode=IDLE q_fp8=(1,32,128) q_offset=2 -> mqa_q=(1,32,128) with lengths clipped.
  context: >-
    ROCm-specific: gfx950 (MI355X) and gfx942 (MI325X), GLM-5.2 DSA, DP-attention with
    EAGLE MTP. CUDA was never affected because those backends take q_offset= and slice
    internally. The GLM52_P1V2 edit sites are byte-identical on v0.5.15.post1 and
    v0.5.16; the later GLM52_P1V3 anchor has only been re-read against v0.5.15.post1.
  call_chain:
    - "sglang/srt/layers/attention/dsa_indexer.py :: forward (aiter/HIP branch)"
    - "aiter paged-MQA logits kernel — sizes its output from q_fp8.shape[0]"
    - "fast_topk_v2 / topk_transform — asserts lengths.size(0) == B"
  symptom_signature: "Expected lengths.size(0) == B to be true, but got false"
  silent: false

verification:
  date: 2026-08-03
  hardware: 8x MI355X (gfx950) and 2x 8x MI325X (gfx942)
  software: sglang v0.5.15.post1 and v0.5.16, ROCm 7.2.0
  workload: GLM-5.2-FP8, DSA attention, --enable-dp-attention with EAGLE MTP
  result: >-
    Crash at first batch (gfx950) / conc>1 (gfx942) becomes a clean run. Captured the
    inverted direction live with the patch's own SGLANG_DEBUG_DSA_ROWS=1 hook.
  notes: >-
    Do NOT reintroduce a `0 < q_offset` lower bound on the trim arm — an earlier
    revision had one and it made fast_topk_v2 assert on exactly the idle ranks.

