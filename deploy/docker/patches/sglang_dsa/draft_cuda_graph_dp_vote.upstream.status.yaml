problem:
  what: >-
    EagleDraftWorker.draft() decides PER RANK whether to replay the draft CUDA graph or
    run the multi-step draft eagerly. The two paths do not issue the same host-side
    collective sequence, so when ranks disagree the whole DP group deadlocks.
  why: >-
    Two of the guard's four terms are rank-dependent by construction. `not
    forward_batch.forward_mode.is_idle()` differs per rank every step. And
    `draft_input.dsa_topk_indices is None` is, on the PD DECODE leg, seeded from
    RDMA-shipped per-request payloads (eagle_disaggregation.py), so it is a function of
    which requests a rank happens to hold. Single-node MIX never hangs because with no
    disaggregation the top-k seed is produced locally by identical code on every rank,
    so term 4 never flips asymmetrically.
  how: >-
    Make the choice a GROUP decision using one more int64 slot in the MLP-sync
    all-gather the scheduler already performs, min()-reduced so any rank needing eager
    takes the whole group eager. Inactive ranks contribute 1 (permissive) and so can
    never drag the group into eager on their own. No new collective is introduced.
  before_fix: >-
    The first routed request hard-deadlocks the PD decode leg. No error, no traceback —
    the group simply stops.
  after_fix: >-
    GLM-5.2 PD with DP-attention and EAGLE MTP serves normally on gfx950, with
    IndexShare left enabled.
  context: >-
    gfx950 / MI355X, sglang v0.5.15.post1, GLM-5.2-FP8, PD disaggregation, DP-attention
    with EAGLE MTP. Reproduces only under disaggregation; single-node mixed serving is
    unaffected. Independently reported upstream on 8x Blackwell, so it is not
    ROCm-specific.
  call_chain:
    - "sglang/srt/speculative/eagle_worker_v2.py :: EagleDraftWorker.draft()"
    - "guard term 2: forward_batch.forward_mode.is_idle() — per-rank occupancy"
    - "guard term 4: draft_input.dsa_topk_indices is None — seeded from RDMA payloads on the PD decode leg"
    - "divergent branch -> mismatched host-side collective sequence -> group deadlock"
  symptom_signature: silent hang on the first routed PD decode request, no log output
  silent: false

verification:
  date: 2026-08-01
  hardware: 8x MI355X (gfx950)
  software: sglang v0.5.15.post1, ROCm 7.2.0
  workload: GLM-5.2-FP8 PD, DP-attention + EAGLE MTP, IndexShare enabled
  result: First-request deadlock cleared; the group takes the same path on every rank.
  notes: >-
    The all-gather slot rides the sync the scheduler already does, so the fix costs no
    extra collective.

