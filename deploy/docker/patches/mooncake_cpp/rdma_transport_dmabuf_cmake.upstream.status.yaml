problem:
  what: >-
    Mooncake at our pin has no dma-buf GPUDirect registration path, so on a fabric that
    exposes only dma-buf it cannot register VRAM for RDMA at all.
  why: >-
    Registration goes through bare ibv_reg_mr, which needs the legacy ib_peer_mem kernel
    module to pin device memory. On a dma-buf-only RoCE fabric that module is absent, so
    there is no mechanism by which the VRAM can be pinned.
  how: >-
    Detect ibv_reg_dmabuf_mr availability in CMakeLists.txt and, when
    MOONCAKE_HIP_DMABUF=1, register GPU buffers through it (dma-buf GPUDirect) instead of
    bare ibv_reg_mr.
  before_fix: >-
    On crusoe amd-spur, GPU memory registration fails outright — RDMA cannot be set up,
    so cross-node PD never starts.
  after_fix: >-
    GPU buffers register via ibv_reg_dmabuf_mr and cross-node PD works on the dma-buf-only
    fabric. PD unit tests pass there.
  context: >-
    Fabric-dependent, not model-dependent. Required on crusoe amd-spur (dma-buf only, no
    ib_peer_mem). On ionic the default path (bare ibv_reg_mr + host-libionic injection)
    works, but must not be used at high utilisation — see HIP-209.
  call_chain:
    - "mooncake-transfer-engine/CMakeLists.txt — probes for ibv_reg_dmabuf_mr"
    - "RdmaContext::registerMemoryRegionInternal — bare ibv_reg_mr for GPU buffers"
    - "no ib_peer_mem -> VRAM cannot be pinned -> registration fails"
  symptom_signature: GPU memory registration failure on a fabric without ib_peer_mem
  silent: false

verification:
  date: 2026-07-29
  hardware: crusoe amd-spur cluster (dma-buf-only RoCE, no ib_peer_mem)
  software: Mooncake main @ 747003c with MOONCAKE_HIP_DMABUF=1
  workload: cross-node PD unit tests
  result: Registration succeeds and the PD tests pass on that fabric.
  notes: null

scope_limits: >-
  Opt-in only. With the default MOONCAKE_HIP_DMABUF=0 this changes nothing, so it is not
  a fix for the ionic default path.

