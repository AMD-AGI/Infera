problem:
  what: >-
    Mooncake installs the HIP (hipIpc) transport unconditionally and prefers it over
    RDMA, so on a multi-node ROCm deployment the engine picks a transport that only works
    within a node.
  why: >-
    hipIpc memory handles are node-local by construction. Upstream #2682 added the
    transport and registered it without any topology or reachability test, and the
    selection order puts it ahead of RDMA, so a cross-node target is attempted over
    hipIpc and fails at handle-open time.
  how: >-
    Gate installation behind an explicit env var — MC_DISABLE_HIP_TRANSPORT to force it
    off, MC_ENABLE_HIP_TRANSPORT to opt in — so ROCm multi-node deployments fall through
    to RDMA. Compiling the gate in unconditionally is what lets the images assert on it.
  before_fix: >-
    Cross-node PD dies with hipIpcOpenMemHandle error 201.
  after_fix: >-
    Cross-node PD runs over RDMA. The strings MC_ENABLE_HIP_TRANSPORT and
    MC_DISABLE_HIP_TRANSPORT are present in the shipped engine .so, which is what the
    build-time assertion checks.
  context: >-
    Any ROCm multi-node deployment on a Mooncake carrying #2682. Not model-specific and
    not arch-specific beyond being ROCm.
  call_chain:
    - "TransferEngineImpl::init -> installTransport(hip) with no reachability test"
    - transport selection prefers hip over rdma
    - "cross-node target -> hipIpcOpenMemHandle -> error 201"
  symptom_signature: "hipIpcOpenMemHandle ... 201"
  silent: false

verification:
  date: 2026-08-01
  hardware: multi-node AMD ROCm with RDMA
  software: "Mooncake main @ 747003c (i.e. including #2682)"
  workload: cross-node PD KV transfer
  result: hipIpcOpenMemHandle 201 cleared; RDMA is selected.
  notes: >-
    The build-time gate assertion is a separate Dockerfile layer on purpose so it runs in
    both BUILD_MOONCAKE branches and shows up in `docker history`.

scope_limits: >-
  The gate does not decide anything by topology — it is an explicit switch. A single-node
  ROCm deployment that would genuinely benefit from hipIpc has to opt in with
  MC_ENABLE_HIP_TRANSPORT.

