upstream_main_affected:
  value: true
  evidence: >-
    Mooncake#2725, which would add the env gate upstream, is still OPEN with no review
    activity, so main still installs the HIP transport unconditionally. #2682, the PR
    that introduced the unconditional install, is merged and in our pin.

applies_to:
  - engine: sglang
    surface: Dockerfile.sglang / Dockerfile.sglang.gfx942
    effect: op
    required_to_run: true
    evidence: >-
      Cross-node PD does not work without it. Both sglang Dockerfiles additionally
      ASSERT the gate is present in the .so they will load (REQUIRE_MOONCAKE_HIP_GATE=1
      greps the binary for MC_ENABLE_HIP_TRANSPORT / MC_DISABLE_HIP_TRANSPORT), because
      a build that silently skipped the rebuild ships stock #2682 and dies at run time.
  - engine: vllm
    surface: Dockerfile.vllm
    effect: op
    required_to_run: true
    evidence: Same assertion layer (step 3b of Dockerfile.vllm), same reasoning.
  - engine: atom
    surface: Dockerfile.atom
    effect: op
    required_to_run: true
    evidence: Same diff and pin.

alive_because:
  reason: upstream-pr-open
  detail: >-
    Ours as #2725, open and unreviewed. Until it merges AND the pin advances past it,
    every ROCm image needs the local gate — and because the failure is a hard runtime
    error on cross-node PD, the images assert the gate is compiled in rather than trust
    the build.
  consumers:
    - every ROCm engine image doing cross-node PD over RDMA
  drop_when: >-
    #2725 merges and MOONCAKE_GIT_REF advances past it.
  drop_signal: pin-advance-only
  silent_misapply_risk: >-
    Inverted here, and worth being clear about: the danger is not the patch outliving its
    reason but the patch silently NOT being applied. That is what the
    REQUIRE_MOONCAKE_HIP_GATE assertion exists for, plus
    deploy/docker/scripts/verify_image_mooncake.sh for images built FROM an already
    published image where the build stage never re-runs.

