problem:
  what: >-
    Buffers larger than the device max_mr_size are silently truncated by ibv_reg_mr while
    BufferDesc.length keeps advertising the full size, so RDMA operations whose target
    lands past the boundary fail.
  why: >-
    registerMemoryRegionInternal saw `length > max_mr_size`, logged a warning and simply
    shortened `length`. The registration then succeeded for a shorter region than the
    descriptor advertises, so a remote peer computes a valid-looking address inside a
    region that was never registered.
  how: >-
    Chunk at registration time: registerLocalMemory splits buffers into <= max_mr_size
    MRs, one BufferDesc per chunk. Because unregisterLocalMemory() only receives the base
    address, the transport remembers each base buffer's chunk start addresses in a
    chunk_map_ guarded by chunk_map_mutex_ so cleanup can find them. The truncation site
    itself becomes a hard error rather than a warning — after chunking, no larger buffer
    should ever reach it, so failing loudly is correct.
  before_fix: >-
    IBV_WC_REM_ACCESS_ERR on RDMA operations whose target lands past the truncation
    boundary, with only a PLOG(WARNING) at registration to hint at why.
  after_fix: >-
    Large KV pools register as multiple MRs and cross-node transfers complete. A buffer
    that somehow still exceeds max_mr_size now returns ERR_INVALID_ARGUMENT instead of
    registering short.
  context: >-
    AMD MI355X + ionic RoCE, where max_mr_size is about 2 GiB — comfortably smaller than
    a production KV pool. Any fabric with a max_mr_size below the pool size hits this;
    it is not ROCm-specific, which is why upstream took it.
  call_chain:
    - "RdmaTransport::registerLocalMemory(addr, length, ...)"
    - "RdmaContext::registerMemoryRegionInternal — compared length > globalConfig().max_mr_size and shrank length"
    - "ibv_reg_mr registers a shorter region than BufferDesc.length advertises"
    - "remote RDMA op targeting past the boundary -> IBV_WC_REM_ACCESS_ERR"
  symptom_signature: IBV_WC_REM_ACCESS_ERR past the max_mr_size boundary
  silent: false

