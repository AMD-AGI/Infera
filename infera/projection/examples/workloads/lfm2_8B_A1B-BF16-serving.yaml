work_group: ${INFERASIM_TEAM:amd}
user_name: ${INFERASIM_USER:root}
exp_name: ${INFERASIM_EXP_NAME:lfm2_8B_A1B-serving}
workspace: ./output

# Serving-projection workload for Liquid AI LFM2-8B-A1B: 18 gated short-conv
# layers and 6 GQA layers over a 32-expert MoE, one GPU, bf16 weights.
modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml

    model: ${INFERASIM_MODEL:lfm2_8B_A1B}.yaml
    overrides:
      stderr_sink_level: DEBUG

      # hyper parameters (serving only reads seq_length / batch shape)
      train_iters: 10
      micro_batch_size: 1
      global_batch_size: 8
      seq_length: ${INFERASIM_SEQ_LENGTH:2048}
      max_position_embeddings: ${INFERASIM_MAX_POSITION_EMBEDDINGS:8192}

      # parallel
      tensor_model_parallel_size: ${INFERASIM_TP:1}
      pipeline_model_parallel_size: ${INFERASIM_PP:1}
      expert_model_parallel_size: ${INFERASIM_EP:1}

      # data
      mock_data: true
      train_data_path: null
      valid_data_path: null
      test_data_path: null

      # ckpt
      finetune: false
      auto_continue_train: false
      load: null
      save: null
      eval_iters: 0
