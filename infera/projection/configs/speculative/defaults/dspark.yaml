# Default acceptance length for dspark, for a model with no measured curve.
# Generated by golden_al.derive_defaults; regenerate with
#   python -m infera.projection.core.projection.inference_projection.golden_al --write-defaults
# Median across models of the InferenceX golden curves (SPEED-Bench coding, temperature 1.0),
# each carried to depths 1-8, a model's own files averaged first.
# thinking_on: deepseek-v4-pro-0813, deepseek-v4.1-flash, kimi-k3
# thinking_off: deepseek-v4.1-flash
#
# key = num_speculative_tokens; value = AL including the verified token
default-dspark:
  thinking_on:
    1: 1.84
    2: 2.48
    3: 2.94
    4: 3.29
    5: 3.53
    6: 3.69
    7: 3.81
    8: 3.89
  thinking_off:
    1: 1.88
    2: 2.62
    3: 3.27
    4: 3.73
    5: 4.07
    6: 4.32
    7: 4.49
    8: 4.60
