# Default acceptance length for mtp, for a model with no measured curve.
# Generated by golden_al.derive_defaults; regenerate with
#   python -m infera.projection.core.projection.inference_projection.golden_al --write-defaults \
#     --golden-dir <InferenceX>/golden_al_distribution
# Median across models of the InferenceX golden curves (golden_al_distribution; SPEED-Bench coding, temperature 1.0),
# each carried to depths 1-8, a model's own files averaged first.
# thinking_on: deepseek-v4-pro, glm-5.2-fp8, qwen3.5-397b-a17b-nvfp4, qwen3.8-flash-next-fp8
# thinking_off: deepseek-v4-pro, qwen3.5-397b-a17b-nvfp4
#
# key = num_speculative_tokens; value = AL including the verified token
default-mtp:
  thinking_on:
    1: 1.81
    2: 2.38
    3: 2.74
    4: 2.94
    5: 3.10
    6: 3.22
    7: 3.31
    8: 3.39
  thinking_off:
    1: 1.92
    2: 2.66
    3: 3.15
    4: 3.42
    5: 3.65
    6: 3.82
    7: 3.87
    8: 3.91
