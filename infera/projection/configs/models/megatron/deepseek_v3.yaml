extends:
  - deepseek_v3_base.yaml

# https://huggingface.co/deepseek-ai/DeepSeek-V3
# 671B total params, 37B active params

tokenizer_type: DeepSeekV3Tokenizer
tokenizer_model: deepseek-ai/DeepSeek-V3

# model
num_layers: 61
hidden_size: 7168
ffn_hidden_size: 18432
num_attention_heads: 128
# mla
q_lora_rank: 1536
kv_lora_rank: 512
qk_head_dim: 128
qk_pos_emb_head_dim: 64
v_head_dim: 128
kv_channels: 128
# mtp
mtp_num_layers: 1
mtp_loss_scaling_factor: 0.1
# moe
moe_layer_freq: "([0]*3+[1]*58)"
num_experts: 256
moe_router_topk: 8
# num_shared_experts: 1  # Calculated as moe_shared_expert_intermediate_size // moe_ffn_hidden_size
moe_ffn_hidden_size: 2048
moe_shared_expert_intermediate_size: 2048 # num_shared_experts * moe_ffn_hidden_size

# device limited routing
expert_model_parallel_size: 8
moe_router_num_groups: 8 # int
moe_router_group_topk: 4 # int

# noted limited routing (ep=32, 4nodes)
# expert_model_parallel_size: 32
# moe_router_num_groups: 4 # int, node number
# moe_router_group_topk: 2 # int

moe_router_topk_scaling_factor: 2.5 # float

# How many distinct experts the trained router actually reaches, as a fraction
# of what independent routing predicts, measured from the checkpoint's own
# router weights with bench/hyperloom_validation/measure_router_coverage.py
# (six layers probed, midpoint of the two probes).
#
# Milder than gpt-oss, which bottoms at 0.78: with 256 experts and top-8 there
# is far more room before selections collide. The mechanism differs too. For
# gpt-oss the uncorrelated gaussian control stays near 1.0 while real embeddings
# fall away, so the cause is that real tokens are correlated and pick
# overlapping experts. Here the control falls almost as far (0.90 against 0.88),
# so most of the reduction is skew in the router weights themselves -- some
# experts are simply more popular whatever the input.
moe_router_coverage: # [tokens in the step, coverage]
  - [1, 1.00]
  - [2, 1.00]
  - [4, 0.98]
  - [8, 0.96]
  - [16, 0.94]
  - [32, 0.91]
  - [64, 0.89]
  - [128, 0.92]
  - [256, 0.96]
