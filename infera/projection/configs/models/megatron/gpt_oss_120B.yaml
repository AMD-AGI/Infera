extends:
  - deepseek_v2_base.yaml

tokenizer_type: DeepSeekV2Tokenizer
tokenizer_model: deepseek-ai/DeepSeek-V2-Lite

# model
num_layers: 36
hidden_size: 2880
ffn_hidden_size: 10944
num_attention_heads: 64

# GQA
multi_latent_attention: false
apply_rope_fusion: false
qk_head_dim: 128
kv_channels: 64
group_query_attention: true
num_query_groups: 8

# Local (sliding-window) attention: gpt-oss alternates 128-token windowed
# layers with full-attention layers, which bounds both decode attention cost
# and the KV-cache footprint of the windowed half at long context.
sink_sliding_window: 128
sink_window_even_layers_only: true

# moe
moe_layer_freq: 1
num_experts: 128
moe_router_topk: 4
moe_ffn_hidden_size: 2880 # moe_intermediate_size
moe_shared_expert_intermediate_size: null # gpt-oss has no shared expert

# How many distinct experts this router really reaches per step, as a fraction
# of what independent per-token routing predicts. Measured from the checkpoint's
# own router weights by bench/hyperloom_validation/measure_router_coverage.py.
# Real token representations are correlated, so tokens pick overlapping experts
# and a decode step reads fewer distinct ones than independence assumes -- worth
# 9.4% -> 7.4% MAPE against the measured TP ladder, and it removes a +29%
# over-prediction at batch 32.
# Fitted against measured decode latency, not against the router's own expert
# counts, and the difference matters. Hooking the running router says it touches
# 33.6 distinct experts at batch 64 where independent routing predicts 111.2 --
# a true coverage of 0.30, not 0.78. Substituting the measured counts makes the
# projection 20-33% low across every batch and context, so the numbers below are
# absorbing a second error as well as routing: with a third of the experts
# active, each one processes three times the tokens, and the grouped-GEMM
# efficiency term does not currently give that back. Until the count and the
# efficiency are separated, this curve is an effective count, not a physical one.
# Measured counts: bench_scratch/real_fidelity/routed_experts.json.
moe_router_coverage: # [tokens in the step, coverage]
  - [1, 1.00]
  - [2, 0.98]
  - [4, 0.95]
  - [8, 0.90]
  - [16, 0.84]
  - [32, 0.79]
  - [64, 0.78]
  - [128, 0.83]
  - [256, 0.90]


# device limited routing
expert_model_parallel_size: 8
moe_router_num_groups: null # int
moe_router_group_topk: null # int
moe_router_topk_scaling_factor: 1.0 # float
