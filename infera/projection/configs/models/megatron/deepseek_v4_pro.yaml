###############################################################################
# DeepSeek-V4 Pro (large MoE variant).
#
# Source: deepseek-v4/deepseek-ai/DeeSeek-v4-Pro/config.json
###############################################################################

extends:
  - deepseek_v4_base.yaml

num_layers: 61
hidden_size: 7168
num_attention_heads: 128
num_query_groups: 1
kv_channels: 512
qk_pos_emb_head_dim: 64
ffn_hidden_size: 18432
moe_ffn_hidden_size: 3072
moe_shared_expert_intermediate_size: 3072

q_lora_rank: 1536
o_lora_rank: 1024
o_groups: 16

num_experts: 384
moe_router_topk: 6
moe_router_topk_scaling_factor: 2.5

index_topk: 1024

# Per-layer compression schedule:
#   0   = uncompressed dense layer (full attention with SWA)
#   4   = CSA branch (overlap mode; per-query top-K from compressed pool via Indexer)
#   128 = HCA branch (non-overlap mode; full visibility over compressed pool)
compress_ratios: "[128, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 128, 4, 0]"

seq_length: 4096
max_position_embeddings: 1048576

vocab_size: 129280
make_vocab_size_divisible_by: 64

tokenizer_type: DeepSeekV4Tokenizer
tokenizer_model: deepseek-ai/DeepSeek-V4-Pro
trust_remote_code: true

init_method_std: 0.02

# Speculative decoding: the checkpoint's MTP head (mtp_num_layers in the base),
# or the DSpark drafter -- three MoE layers over a 128-token window with a
# rank-256 serial head. Acceptance is InferenceX's golden curve for each; the
# DSpark sweep was measured on the 0813 checkpoint.
speculative:
  mtp:
    acceptance: dsv4_mtp.yaml
  dspark:
    layers: 3
    window: 128
    acceptance: dsv4-pro-0813-dspark.yaml
