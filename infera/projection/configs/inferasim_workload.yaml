# The smallest experiment config the launcher will accept, used as the default
# for sweeps.
#
# Nothing here trains and no Megatron code runs -- Megatron need not even be
# installed. ``framework`` and ``model`` only choose which file the architecture
# is read from (configs/models/<framework>/<model>.yaml), and ``pre_trainer`` is
# the launcher's name for that config slot rather than a component; the schema
# offers no serving slot, so every workload declares a trainer one. The model
# name comes from INFERASIM_MODEL, which a sweep sets per point.
#
# There are no tuning knobs here on purpose. A sweep passes everything that
# decides a projection through the CLI -- parallelism as config overrides,
# sequence lengths, batch, dtypes and GPU arch as flags -- so anything declared
# here would be overwritten before it was read. The fields below are only the
# ones the launcher insists on.
#
# Pass ``sweep(workload=...)`` to project against a config of your own.
work_group: ${INFERASIM_TEAM:amd}
user_name: ${INFERASIM_USER:root}
exp_name: ${INFERASIM_EXP_NAME:inference-sweep}
workspace: ${INFERASIM_WORKSPACE:./output}

modules:
  pre_trainer:
    framework: megatron
    config: pre_trainer.yaml
    model: ${INFERASIM_MODEL:gpt_oss_120B}.yaml
